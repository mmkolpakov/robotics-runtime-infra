services:
  installed-postprocessor:
    image: "${C18_NODE_IMAGE:?required}"
    pull_policy: never
    init: true
    user: "1000:1000"
    network_mode: none
    read_only: true
    mem_limit: 1g
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    entrypoint: [node, /app/postprocess.mjs]
    environment:
      C18_HOST_OWNER: "${C18_HOST_OWNER:?required}"
      C18_HOST_PROJECT: "${C18_HOST_PROJECT:?required}"
      C18_NODE_IMAGE: "${C18_NODE_IMAGE:?required}"
      C18_SOURCE_VOLUME: "${C18_SOURCE_VOLUME:?required}"
      C18_RETAINED_VOLUME: "${C18_RETAINED_VOLUME:?required}"
    volumes: [retained:/retained, "${C18_SOCKET:?required}:/engine.sock:ro"]
    labels:
      org.robotics.runtime.run-id: "${C18_HOST_OWNER:?required}"
volumes:
  retained:
    external: true
    name: "${C18_RETAINED_VOLUME:?required}"
