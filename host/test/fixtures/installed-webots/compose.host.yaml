services:
  storage-init:
    image: "${C18_NODE_IMAGE:?stock installed consumer image required}"
    pull_policy: never
    init: true
    user: "0:0"
    userns_mode: keep-id:uid=1000,gid=1000
    network_mode: none
    entrypoint: [node, /app/init-storage.mjs]
    volumes:
      - source:/run/robotics
      - retained:/retained
    labels:
      org.robotics.runtime.run-id: "${C18_HOST_OWNER:?host owner required}"
  installed-host:
    image: "${C18_NODE_IMAGE:?stock installed consumer image required}"
    pull_policy: never
    init: true
    user: "1000:1000"
    userns_mode: keep-id:uid=1000,gid=1000
    network_mode: none
    read_only: true
    mem_limit: 1g
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      C18_SOURCE_VOLUME: "${C18_SOURCE_VOLUME:?source required}"
      C18_RETAINED_VOLUME: "${C18_RETAINED_VOLUME:?retained required}"
    volumes:
      - source:/run/robotics
      - retained:/retained
      - "${C18_SOCKET:?owned engine socket required}:/engine.sock:ro"
    labels:
      org.robotics.runtime.run-id: "${C18_HOST_OWNER:?host owner required}"
  source-byte-audit:
    image: "${C18_WORKER_IMAGE:?qualified native SDK worker required}"
    pull_policy: never
    init: true
    user: "10001:1000"
    userns_mode: keep-id:uid=1000,gid=1000
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    entrypoint: [/opt/contracts/bin/python, /opt/c18/portable-checks.py]
    volumes: [source:/run/robotics:ro, retained:/retained]
    labels:
      org.robotics.runtime.run-id: "${C18_HOST_OWNER:?host owner required}"
volumes:
  source:
    name: "${C18_SOURCE_VOLUME:?source required}"
    labels:
      org.robotics.runtime.storage-owner: "${C18_HOST_OWNER:?host owner required}"
      org.robotics.runtime.run-id: "${C18_HOST_OWNER:?host owner required}"
  retained:
    external: true
    name: "${C18_RETAINED_VOLUME:?retained required}"
