---
x-zenoh-node: &zenoh-node
  image: "${EDGE_IMAGE:-local/robotics-runtime-infra/edge:dev}"
  user: "${ROBOTICS_HOST_UID:-1000}:${ROBOTICS_HOST_GID:-1000}"
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  profiles: [zenoh]
  environment:
    HOME: /tmp
    RCUTILS_COLORIZED_OUTPUT: "0"
    RMW_IMPLEMENTATION: rmw_fastrtps_cpp
    ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
  healthcheck:
    disable: true

x-zenoh-bridge: &zenoh-bridge
  image: >-
    eclipse/zenoh-bridge-ros2dds:1.9.0@sha256:5aca6798ae112e390a97788450fd37360ddd72ac092032a25acf9fac17b2d9af
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  profiles: [zenoh]
  environment:
    ROS_DISTRO: jazzy
  volumes:
    - type: bind
      source: ./config/zenoh
      target: /etc/robotics/zenoh
      read_only: true
  healthcheck:
    disable: true

services:
  zenoh-source-plane:
    image: registry.k8s.io/pause:3.10.1@sha256:278fb9dbcca9518083ad1e11276933a2e96f23de604a3a08cc3c80002767d24c
    profiles: [zenoh]
    networks: [zenoh-backbone]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      disable: true

  zenoh-destination-plane:
    image: registry.k8s.io/pause:3.10.1@sha256:278fb9dbcca9518083ad1e11276933a2e96f23de604a3a08cc3c80002767d24c
    profiles: [zenoh]
    networks: [zenoh-backbone]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      disable: true

  zenoh-source-bridge:
    <<: *zenoh-bridge
    network_mode: service:zenoh-source-plane
    command: [-c, /etc/robotics/zenoh/source.json5]
    depends_on:
      zenoh-source-plane:
        condition: service_started

  zenoh-destination-bridge:
    <<: *zenoh-bridge
    network_mode: service:zenoh-destination-plane
    command: [-c, /etc/robotics/zenoh/destination.json5]
    depends_on:
      zenoh-destination-plane:
        condition: service_started
      zenoh-source-bridge:
        condition: service_started

  zenoh-subscriber:
    <<: *zenoh-node
    network_mode: service:zenoh-destination-plane
    environment:
      HOME: /tmp
      RCUTILS_COLORIZED_OUTPUT: "0"
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
      ROS_DOMAIN_ID: "32"
    command:
      - bash
      - -euo
      - pipefail
      - -c
      - |
        rm -f /reports/messages.csv /reports/channel-observation.json
        status=0
        timeout 25 ros2 topic echo \
          /robotics/trace_context \
          robotics_observability_msgs/msg/TraceContext --csv \
          > /reports/messages.csv || status=$?
        test "$${status}" -eq 0 || test "$${status}" -eq 124
        traceparent=00-0123456789abcdef0123456789abcdef-0123456789abcdef-01
        tracestate=runtime=zenoh
        received="$$(grep -c "$${traceparent}" /reports/messages.csv || true)"
        states="$$(grep -c "$${tracestate}" /reports/messages.csv || true)"
        minimum=10
        jq -n \
          --arg message_type robotics_observability_msgs/msg/TraceContext \
          --arg traceparent "$${traceparent}" \
          --arg tracestate "$${tracestate}" \
          --argjson sent 20 \
          --argjson received "$${received}" \
          --argjson states "$${states}" \
          --argjson minimum "$${minimum}" \
          -f /etc/robotics/zenoh/channel-observation.jq \
          > /reports/channel-observation.json
        jq -e '.status == "passed"' /reports/channel-observation.json
        touch /reports/complete
    volumes:
      - type: bind
        source: "${ROBOTICS_ZENOH_REPORT_DIR:-./artifacts/zenoh}"
        target: /reports
      - type: bind
        source: ./config/zenoh
        target: /etc/robotics/zenoh
        read_only: true
    depends_on:
      zenoh-destination-bridge:
        condition: service_started

  zenoh-publisher:
    <<: *zenoh-node
    network_mode: service:zenoh-source-plane
    environment:
      HOME: /tmp
      RCUTILS_COLORIZED_OUTPUT: "0"
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
      ROS_DOMAIN_ID: "31"
    command:
      - bash
      - -euo
      - pipefail
      - -c
      - |
        sleep 8
        traceparent=00-0123456789abcdef0123456789abcdef-0123456789abcdef-01
        ros2 topic pub \
          --rate 20 \
          --times 20 \
          /robotics/trace_context \
          robotics_observability_msgs/msg/TraceContext \
          "{traceparent: '$${traceparent}', tracestate: 'runtime=zenoh'}"
        timeout 30 bash -c \
          'until test -f /reports/complete; do sleep 1; done'
    volumes:
      - type: bind
        source: "${ROBOTICS_ZENOH_REPORT_DIR:-./artifacts/zenoh}"
        target: /reports
    depends_on:
      zenoh-source-bridge:
        condition: service_started
      zenoh-subscriber:
        condition: service_started

networks:
  zenoh-backbone:
    internal: true
