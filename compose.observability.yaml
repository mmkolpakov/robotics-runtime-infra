---
services:
  otel-collector:
    image: >-
      otel/opentelemetry-collector-contrib:0.153.0@sha256:93aad750175cbf1a973ae1c5886c3371f4d800f61be25cdd26870b8441ffe9fa
    profiles: [observability]
    command: [--config=/etc/otelcol-contrib/config.yaml]
    environment:
      ROBOTICS_DOMAIN_ID: "${ROBOTICS_DOMAIN_ID}"
      ROBOTICS_RUN_ID: "${ROBOTICS_RUN_ID}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    volumes:
      - type: bind
        source: ./config/observability/otel-collector.yaml
        target: /etc/otelcol-contrib/config.yaml
        read_only: true
      - type: bind
        source: "${ROBOTICS_EVIDENCE_DIR:-./runs/current/evidence}"
        target: /evidence
    ports:
      - "127.0.0.1:${ROBOTICS_OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${ROBOTICS_OTLP_HTTP_PORT:-4318}:4318"
      - "127.0.0.1:${ROBOTICS_OTEL_HEALTH_PORT:-13133}:13133"
