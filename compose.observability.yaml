---
x-observability-environment: &observability-environment
  GZ_PARTITION: "${GZ_PARTITION:-robotics-runtime}"
  HOME: /tmp
  RCUTILS_COLORIZED_OUTPUT: "0"
  RMW_IMPLEMENTATION: "${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}"
  ROS_AUTOMATIC_DISCOVERY_RANGE: "${ROS_AUTOMATIC_DISCOVERY_RANGE:-SUBNET}"
  ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"

x-observability-node: &observability-node
  image: "${SIMULATION_IMAGE:-local/robotics-runtime-infra/simulation:dev}"
  profiles: [observability]
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  runtime-probe-publisher:
    <<: *observability-node
    profiles: [acceptance]
    command:
      - ros2
      - topic
      - pub
      - --rate
      - "20"
      - --print
      - "0"
      - --wait-matching-subscriptions
      - "1"
      - --max-wait-time-secs
      - "30"
      - --qos-reliability
      - reliable
      - --qos-depth
      - "100"
      - /robotics/runtime_probe
      - std_msgs/msg/UInt64
      - "{data: 1}"
    environment:
      <<: *observability-environment
    depends_on:
      simulation:
        condition: service_healthy

  runtime-metrics:
    <<: *observability-node
    command: [ros2, run, robotics_observability, runtime_metrics]
    environment:
      <<: *observability-environment
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel-collector:4318/v1/metrics
      ROBOTICS_METRICS_EXPORT_INTERVAL_MS: "${ROBOTICS_METRICS_EXPORT_INTERVAL_MS:-100}"
      ROBOTICS_METRICS_TOPIC: "${ROBOTICS_METRICS_TOPIC:-/robotics/runtime_probe}"
      ROBOTICS_TIME_TOPIC: "${ROBOTICS_TIME_TOPIC:-/clock}"
      ROBOTICS_TIME_SOURCE_ID: "${ROBOTICS_TIME_SOURCE_ID:-gazebo-clock}"
    depends_on:
      simulation:
        condition: service_healthy
      otel-collector:
        condition: service_started

  otel-collector:
    image: >-
      otel/opentelemetry-collector-contrib:0.153.0@sha256:93aad750175cbf1a973ae1c5886c3371f4d800f61be25cdd26870b8441ffe9fa
    profiles: [observability]
    command: [--config=/etc/otelcol-contrib/config.yaml]
    environment:
      ROBOTICS_DOMAIN_ID: "${ROBOTICS_DOMAIN_ID}"
      ROBOTICS_RUN_ID: "${ROBOTICS_RUN_ID}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    volumes:
      - type: bind
        source: ./config/observability/otel-collector.yaml
        target: /etc/otelcol-contrib/config.yaml
        read_only: true
      - type: bind
        source: "${ROBOTICS_EVIDENCE_DIR:-./runs/current/evidence}"
        target: /evidence
    ports:
      - "127.0.0.1:${ROBOTICS_OTLP_GRPC_PORT:-}:4317"
      - "127.0.0.1:${ROBOTICS_OTLP_HTTP_PORT:-}:4318"
      - "127.0.0.1:${ROBOTICS_OTEL_HEALTH_PORT:-}:13133"
