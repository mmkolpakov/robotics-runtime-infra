---
name: Set up pinned Buildx
description: Configure the repository-pinned BuildKit builder and optional ARM64 emulation.

inputs:
  qemu:
    description: Install the pinned ARM64 binfmt handler.
    default: "false"

runs:
  using: composite
  steps:
    - if: inputs.qemu == 'true'
      uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0
      with:
        # yamllint disable-line rule:line-length
        image: docker.io/tonistiigi/binfmt:qemu-v10.2.3-68@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
        platforms: arm64
    - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0
      with:
        cache-binary: false
        version: v0.35.0
        driver-opts: |
          image=moby/buildkit:v0.31.1@sha256:6b59b7df63a8cb9902736f9ddf7fcff8261613d3e7449b8ea8b7537fc399c03a
