---
name: release-images

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TRIVY_IMAGE: aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f

jobs:
  verify-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag belongs to main
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin \
            refs/heads/main:refs/remotes/origin/main
          tagged_commit="$(git rev-parse 'HEAD^{commit}')"
          main_commit="$(git rev-parse 'refs/remotes/origin/main^{commit}')"
          if ! git merge-base --is-ancestor "$tagged_commit" "$main_commit"; then
            echo "::error::Tagged commit $tagged_commit is not reachable from origin/main"
            exit 1
          fi

  quality-gates:
    needs: verify-source
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  foundation-gate:
    needs: verify-source
    permissions:
      contents: read
    uses: ./.github/workflows/foundation-integration.yml

  prepare:
    needs:
      - quality-gates
      - foundation-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-buildx
      - name: Resolve the declarative release plan
        id: plan
        run: scripts/ci/release/prepare-plan.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-plan-${{ github.ref_name }}
          path: artifacts/release-plan.json
          if-no-files-found: error
          retention-days: 30

  candidate:
    needs: prepare
    name: candidate-${{ matrix.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      # yamllint disable-line rule:line-length
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/robotics-runtime-infra/${{ matrix.id }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-buildx
        with:
          qemu: ${{ contains(matrix.platforms, 'linux/arm64') }}
      - uses: docker/setup-compose-action@16feee727cbdc83b6a014e6cc26fec4a79bcf30c  # v2.2.0
        with:
          version: v5.3.1
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Set reproducible build metadata
        run: scripts/ci/set-build-metadata.sh
      - name: Build an untagged candidate by digest
        id: build
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b  # v7.3.0
        env:
          DOCKER_BUILD_RECORD_RETENTION_DAYS: 7
        with:
          source: .
          files: ./docker-bake.hcl
          targets: ${{ matrix.target }}
          pull: true
          push: true
          provenance: mode=max
          sbom: true
          vars: |
            IMAGE_SOURCE=${{ github.server_url }}/${{ github.repository }}
            VERSION=${{ needs.prepare.outputs.version }}
          # Preserve Bake contexts and publish no mutable or SemVer tag yet.
          # yamllint disable rule:line-length
          set: |
            ${{ matrix.target }}.platform=${{ join(matrix.platforms, ',') }}
            ${{ matrix.target }}.tags=${{ env.IMAGE_NAME }}
            ${{ matrix.target }}.output=type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true,rewrite-timestamp=true
          # yamllint enable rule:line-length
      - name: Resolve the candidate digest
        id: digest
        env:
          BAKE_METADATA: ${{ steps.build.outputs.metadata }}
          BAKE_TARGET: ${{ matrix.target }}
        run: |
          digest="$(
            jq -er --arg target "${BAKE_TARGET}" \
              '.[$target]["containerimage.digest"]' <<<"${BAKE_METADATA}"
          )"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
      - name: Verify the simulation candidate
        if: matrix.id == 'simulation'
        env:
          SIMULATION_IMAGE: ${{ env.IMAGE_NAME }}@${{ steps.digest.outputs.digest }}
        run: |
          project="release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker compose -p "$project" --profile test down --volumes --remove-orphans || true' EXIT
          docker compose -p "$project" pull simulation
          docker compose -p "$project" up --detach --no-build --wait --wait-timeout 120 simulation
          docker compose -p "$project" exec -T simulation \
            robotics-entrypoint timeout 20 ros2 topic echo \
            /clock rosgraph_msgs/msg/Clock --once
          docker compose -p "$project" --profile test run --rm --no-deps test
      - name: Scan every candidate platform
        env:
          CANDIDATE_ID: ${{ matrix.id }}
          DIGEST: ${{ steps.digest.outputs.digest }}
          PLATFORMS: ${{ join(matrix.platforms, ',') }}
        run: >-
          scripts/ci/security/scan-image.sh
          "${IMAGE_NAME}@${DIGEST}"
          "${CANDIDATE_ID}"
          "${PLATFORMS}"
      - name: Attest the verified candidate
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763  # v4.1.1
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
      - name: Verify candidate attestation
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh attestation verify
          "oci://${IMAGE_NAME}@${DIGEST}"
          --repo "${GITHUB_REPOSITORY}"
          --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release-image.yml"
          --source-digest "${GITHUB_SHA}"
          --source-ref "${GITHUB_REF}"
          --deny-self-hosted-runners
          --bundle-from-oci
      - name: Record the immutable candidate
        env:
          CANDIDATE_ENVIRONMENT_VARIABLE: ${{ matrix.environment_variable }}
          CANDIDATE_ID: ${{ matrix.id }}
          CANDIDATE_PLATFORMS: ${{ join(matrix.platforms, ',') }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: >-
          scripts/ci/release/record-candidate.sh
          "${CANDIDATE_ID}"
          "${CANDIDATE_ENVIRONMENT_VARIABLE}"
          "${IMAGE_NAME}"
          "${DIGEST}"
          "${CANDIDATE_PLATFORMS}"
          "artifacts/release-candidates/${CANDIDATE_ID}.json"
      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a  # v4.36.3
        with:
          sarif_file: artifacts/security
          category: release-candidate-${{ matrix.id }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: candidate-${{ matrix.id }}-${{ github.ref_name }}
          path: |
            artifacts/release-candidates/
            artifacts/security/
          if-no-files-found: error
          retention-days: 7

  promote:
    needs:
      - prepare
      - candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-buildx
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3  # v8.0.0
        with:
          name: release-plan-${{ github.ref_name }}
          path: artifacts
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3  # v8.0.0
        with:
          pattern: candidate-*-${{ github.ref_name }}
          path: candidate-artifacts
          merge-multiple: true
      - name: Promote the complete verified set
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: >-
          scripts/ci/release/promote-candidates.sh
          artifacts/release-plan.json
          candidate-artifacts/release-candidates
          "${VERSION}"
          artifacts/release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-bundle-${{ github.ref_name }}
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 30

  release:
    needs: promote
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3  # v8.0.0
        with:
          name: release-bundle-${{ github.ref_name }}
          path: release
      - name: Publish release notes, lock, and digest records
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" \
            release/release.env \
            release/digests/*.txt \
            "${release_flags[@]}" \
            --verify-tag \
            --title "robotics-runtime-infra ${GITHUB_REF_NAME}" \
            --notes-file release/release-notes.md
