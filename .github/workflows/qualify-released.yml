---
name: qualify-released-runtime

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    # yamllint disable-line rule:line-length
    uses: mmkolpakov/robotics-runtime-infra/.github/workflows/reusable-qualify.yml@51d2bf0a408d67d72072a4f3b38e86d26f6d7c06
    with:
      tooling_ref: 51d2bf0a408d67d72072a4f3b38e86d26f6d7c06
      execution_mode: released
      release_tag: v0.9.0-rc.1
      release_lock: examples/minimal-consumer/release.env
      scenario: examples/minimal-consumer/scenario.yaml
      compose_project: examples/minimal-consumer/compose.yaml
      artifact_arguments_file: examples/minimal-consumer/artifact-arguments.txt

  independent-consumer:
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          path: caller
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: mmkolpakov/robotics-runtime-infra
          ref: 51d2bf0a408d67d72072a4f3b38e86d26f6d7c06
          path: tooling
          persist-credentials: false
      - name: Verify the immutable tooling checkout
        shell: bash
        env:
          TOOLING_REF: 51d2bf0a408d67d72072a4f3b38e86d26f6d7c06
        run: test "$(git -C tooling rev-parse HEAD)" = "${TOOLING_REF}"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3  # v8.0.0
        with:
          name: qualification-${{ github.sha }}
          path: ${{ runner.temp }}/qualification-consumer/artifacts
      - name: Verify the published consumer
        uses: ./caller/.github/actions/verify-published-consumer
        with:
          tooling-directory: ${{ github.workspace }}/tooling
          package-directory: ${{ runner.temp }}/qualification-consumer/artifacts/qualification
          # The downloaded key establishes package integrity; image provenance is verified separately.
          authentication: ephemeral
          expected_execution_type: simulator
      - name: Upload independent consumer observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: released-independent-consumer-${{ github.sha }}
          path: ${{ runner.temp }}/qualification-consumer/reports/
          if-no-files-found: error
          retention-days: 30
