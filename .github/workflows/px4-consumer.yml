---
name: px4-consumer

on:
  pull_request:
    paths:
      - examples/px4-x500/**
      - .github/workflows/px4-consumer.yml
  push:
    branches: [main]
    paths:
      - examples/px4-x500/**
      - .github/workflows/px4-consumer.yml
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: examples/px4-x500

concurrency:
  group: px4-consumer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installed-document-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - name: Check out the exact source SDK candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: mmkolpakov/robotics-runtime
          ref: 00735515f71e53bbea9f8761f76db81dcea73299
          path: .sdk-source
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - name: Build and check committed SDK policy before installation
        run: |
          uv build --wheel --out-dir sdk-wheels ../../.sdk-source/packages/contracts
          uv build --wheel --out-dir sdk-wheels ../../.sdk-source/packages/harness
          python3 check-sdk-wheels.py sdk-wheels
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python --require-hashes --find-links=sdk-wheels -r requirements.lock
          .venv/bin/python -I -m ensurepip --upgrade
          uv build --wheel --out-dir dist evaluator
      - name: Extract the pinned vendor Cosign executable
        run: |
          mkdir -p results
          tool_index=sha256:3fad8be83b93869051c08bb98f36612afe81dabe06c288e70e41ce09a037ba18
          tool_cid=$(docker create --platform=linux/amd64 cgr.dev/chainguard/cosign@"$tool_index")
          trap 'docker rm "$tool_cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$tool_cid:/usr/bin/cosign" results/cosign
          echo '9deba5b08d25e35d107abd491f8f6c774a880d986ecfddc6761c1f9593bdaa81  results/cosign' | sha256sum -c -
          chmod 755 results/cosign
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path("results/cosign-profile.json").write_text(json.dumps({
              "executable": str(Path("results/cosign").resolve()),
              "executable_sha256": "9deba5b08d25e35d107abd491f8f6c774a880d986ecfddc6761c1f9593bdaa81",
              "version": "v3.1.3+dirty",
          }))
          PY
      - name: Authenticate method bytes and shape before installation or imports
        run: |
          .venv/bin/python -I test_admission_fixture.py \
            --wheel dist/px4_x500_evaluator-0.1.0-py3-none-any.whl \
            --tool-profile results/cosign-profile.json --output results/authenticated
          .venv/bin/python -I -m pip install --no-index --no-deps \
            results/authenticated/px4_x500_evaluator-0.1.0-py3-none-any.whl
          .venv/bin/python -I -m pip check
      - name: Test installed public JSON/JUnit and bounded raw-byte controls
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          PX4_SDK_WHEELS="$PWD/sdk-wheels" \
            PX4_EVALUATOR_BINDING="$PWD/results/authenticated/binding.json" \
            PX4_ADMISSION="$PWD/results/authenticated" \
            .venv/bin/python -I -m unittest discover -s . -p 'test_*.py'
      - name: Test stock consumer interfaces without native launch
        run: |
          npm ci --ignore-scripts --no-fund
          npm test
