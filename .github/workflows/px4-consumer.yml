---
name: px4-consumer

on:
  pull_request:
    paths:
      - examples/px4-x500/**
      - host/tools/prepare-px4-image.py
      - host/tools/test_prepare_px4_image.py
      - host/tools/build-px4-stock.sh
      - host/workers/px4/probe.py
      - host/test/test_px4_probe_identity.py
      - docker/px4-sitl*.Dockerfile
      - docker/apt/px4-jetty-closure.lock
      - docker/apt/use-package-snapshots
      - docker/python/px4-sitl.lock
      - docker/python/px4-sdk-build.lock
      - host/workers/px4/mavsdk-source-lock.json
      - host/workers/legacy-finalization/export_retained.py
      - scripts/ci/build-px4-source-images.sh
      - scripts/ci/security/**
      - test/ci/test_px4_source_sdk_factory.py
      - test/ci/px4-source-images.bats
      - .github/actions/setup-buildx/**
      - .trivyignore
      - trivy.yaml
      - security/vex/**
      - docker/python/px4-native-sdk.lock
      - compose.px4-sdk.yaml
      - .github/workflows/px4-consumer.yml
  push:
    branches: [main]
    paths:
      - examples/px4-x500/**
      - host/tools/prepare-px4-image.py
      - host/tools/test_prepare_px4_image.py
      - host/tools/build-px4-stock.sh
      - host/workers/px4/probe.py
      - host/test/test_px4_probe_identity.py
      - docker/px4-sitl*.Dockerfile
      - docker/apt/px4-jetty-closure.lock
      - docker/apt/use-package-snapshots
      - docker/python/px4-sitl.lock
      - docker/python/px4-sdk-build.lock
      - host/workers/px4/mavsdk-source-lock.json
      - host/workers/legacy-finalization/export_retained.py
      - scripts/ci/build-px4-source-images.sh
      - scripts/ci/security/**
      - test/ci/test_px4_source_sdk_factory.py
      - test/ci/px4-source-images.bats
      - .github/actions/setup-buildx/**
      - .trivyignore
      - trivy.yaml
      - security/vex/**
      - docker/python/px4-native-sdk.lock
      - compose.px4-sdk.yaml
      - .github/workflows/px4-consumer.yml
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: examples/px4-x500

concurrency:
  group: px4-consumer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installed-document-controls:
    runs-on: >-
      ${{ fromJSON('{"hosted":"ubuntu-24.04","home":["self-hosted","linux","x64","robotics-ci-home"]}')
          [vars.ROBOTICS_CI_EXECUTOR || 'hosted'] }}
    timeout-minutes: 10
    steps:
      - name: Check CI executor and source context
        id: ci-profile
        uses: mmkolpakov/robotics-runtime-infra/.github/actions/ci-profile@b6a8138e988bfd55c513c3f6fc770adb4546dcda
        with:
          executor: ${{ vars.ROBOTICS_CI_EXECUTOR || 'hosted' }}
          architecture: x64
          runner-environment: ${{ runner.environment }}
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - name: Check source image contexts and actor probes without native execution
        working-directory: .
        run: |
          python3 -I -m unittest discover -s host/tools -p test_prepare_px4_image.py
          python3 -I -m unittest discover -s host/test -p test_px4_probe_identity.py
      - name: Download and check the exact published SDK before installation
        run: |
          uv venv --python 3.12 .venv
          .venv/bin/python -I -m ensurepip --upgrade
          .venv/bin/python -I -m pip download --index-url https://pypi.org/simple \
            --require-hashes --only-binary=:all: --no-deps --dest sdk-wheels -r requirements.lock
          python3 check-sdk-wheels.py sdk-wheels
          .venv/bin/python -I -m pip install --no-index --find-links=sdk-wheels \
            --require-hashes --only-binary=:all: -r requirements.lock
          .venv/bin/python -I -m pip check
          uv build --wheel --out-dir dist evaluator
      - name: Extract the pinned vendor Cosign executable
        run: |
          mkdir -p results
          tool_index=sha256:3fad8be83b93869051c08bb98f36612afe81dabe06c288e70e41ce09a037ba18
          tool_cid=$(docker create --platform=linux/amd64 cgr.dev/chainguard/cosign@"$tool_index")
          trap 'docker rm "$tool_cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$tool_cid:/usr/bin/cosign" results/cosign
          echo '9deba5b08d25e35d107abd491f8f6c774a880d986ecfddc6761c1f9593bdaa81  results/cosign' | sha256sum -c -
          chmod 755 results/cosign
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path("results/cosign-profile.json").write_text(json.dumps({
              "executable": str(Path("results/cosign").resolve()),
              "executable_sha256": "9deba5b08d25e35d107abd491f8f6c774a880d986ecfddc6761c1f9593bdaa81",
              "version": "v3.1.3+dirty",
          }))
          PY
      - name: Authenticate method bytes and shape before installation or imports
        run: |
          version=$(.venv/bin/python -I -c \
            'import tomllib; print(tomllib.load(open("evaluator/pyproject.toml", "rb"))["project"]["version"])')
          wheel="px4_x500_evaluator-${version}-py3-none-any.whl"
          .venv/bin/python -I test_admission_fixture.py \
            --wheel "dist/${wheel}" \
            --tool-profile results/cosign-profile.json --output results/authenticated
          .venv/bin/python -I -m pip install --no-index --no-deps \
            "results/authenticated/${wheel}"
          .venv/bin/python -I -m pip check
      - name: Test installed public JSON/JUnit and bounded raw-byte controls
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          PX4_SDK_WHEELS="$PWD/sdk-wheels" \
            PX4_EVALUATOR_BINDING="$PWD/results/authenticated/binding.json" \
            PX4_ADMISSION="$PWD/results/authenticated" \
            .venv/bin/python -I -m unittest discover -s . -p 'test_*.py'
      - name: Test stock consumer interfaces without native launch
        run: |
          npm ci --ignore-scripts --no-fund
          npm test

  source-images:
    runs-on: >-
      ${{ fromJSON('{"hosted":"ubuntu-24.04","home":["self-hosted","linux","x64","robotics-ci-home"]}')
          [vars.ROBOTICS_CI_EXECUTOR || 'hosted'] }}
    timeout-minutes: 120
    defaults:
      run:
        working-directory: .
    env:
      TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
    steps:
      - name: Check CI executor and source context
        id: ci-profile
        uses: mmkolpakov/robotics-runtime-infra/.github/actions/ci-profile@b6a8138e988bfd55c513c3f6fc770adb4546dcda
        with:
          executor: ${{ vars.ROBOTICS_CI_EXECUTOR || 'hosted' }}
          architecture: x64
          runner-environment: ${{ runner.environment }}
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-buildx
      - name: Build the locked PX4 dependency image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          file: docker/px4-sitl-deps.Dockerfile
          platforms: linux/amd64
          load: true
          tags: local/robotics-px4-deps:px4-source-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=px4-deps-amd64
          cache-to: type=gha,mode=max,scope=px4-deps-amd64
      - name: Build the locked PX4 firmware, SDK and complete source worker
        run: scripts/ci/build-px4-source-images.sh
      - name: Upload source image identities, inventories and security results
        if: always() && steps.ci-profile.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: px4-source-images-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/px4-source-*/
            artifacts/security/
          if-no-files-found: error
          retention-days: 7
