---
name: qualify-runtime-scenario

on:
  workflow_call:
    inputs:
      tooling_ref:
        description: Exact robotics-runtime-infra commit SHA.
        required: true
        type: string
      scenario:
        description: Scenario path relative to the caller repository.
        required: true
        type: string
      compose_project:
        description: Optional standalone Compose model relative to the caller repository.
        required: false
        default: ""
        type: string
      services:
        description: Newline-delimited allow-list of every service in compose_project.
        required: false
        default: ""
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      EVIDENCE_IMAGE: local/robotics-runtime-infra/evidence-sink:foundation
      OBSERVER_IMAGE: local/robotics-runtime-infra/acceptance-observer:foundation
      POLICY_TOOLING_IMAGE: local/robotics-runtime-infra/policy-tooling:foundation
      REGISTRY: local
      SIMULATION_IMAGE: local/robotics-runtime-infra/simulation:foundation
      VERSION: foundation
    steps:
      - name: Validate the immutable tooling reference
        env:
          TOOLING_REF: ${{ inputs.tooling_ref }}
        run: '[[ "${TOOLING_REF}" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          path: consumer
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: mmkolpakov/robotics-runtime-infra
          ref: ${{ inputs.tooling_ref }}
          path: tooling
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: false
      - uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43  # 4.0.0
        with:
          bats-version: "1.14.0"
      - uses: ./tooling/.github/actions/setup-buildx
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: v3.1.2
      - name: Resolve caller inputs
        env:
          COMPOSE_PROJECT: ${{ inputs.compose_project }}
          SCENARIO: ${{ inputs.scenario }}
          TOOLING_REF: ${{ inputs.tooling_ref }}
        run: |
          test "$(git -C tooling rev-parse HEAD)" = "${TOOLING_REF}"
          consumer_root="$(realpath consumer)"
          scenario="$(realpath -e "${consumer_root}/${SCENARIO}")"
          case "${scenario}" in "${consumer_root}"/*) ;; *) exit 64 ;; esac
          printf 'ROBOTICS_FOUNDATION_SCENARIO=%s\n' \
            "${scenario}" >>"${GITHUB_ENV}"
          printf 'ROBOTICS_FOUNDATION_CONSUMER_ROOT=%s\n' \
            "${consumer_root}" >>"${GITHUB_ENV}"
          if test -n "${COMPOSE_PROJECT}"; then
            compose_project="$(realpath -e "${consumer_root}/${COMPOSE_PROJECT}")"
            case "${compose_project}" in "${consumer_root}"/*) ;; *) exit 64 ;; esac
            printf 'ROBOTICS_FOUNDATION_COMPOSE_PROJECT=%s\n' \
              "${compose_project}" >>"${GITHUB_ENV}"
          fi
      - name: Import and validate exact foundation sources
        working-directory: tooling
        run: |
          scripts/ci/set-build-metadata.sh
          bash scripts/ci/foundation/import-sources.sh
          bash scripts/ci/foundation/validate-foundation.sh
      - name: Build and verify the foundation images
        working-directory: tooling
        run: |
          bash scripts/ci/foundation/build-images.sh
          bash scripts/ci/foundation/verify-image-lock.sh
      - name: Qualify the caller scenario
        working-directory: tooling
        env:
          ROBOTICS_FOUNDATION_ARTIFACT_DIR: ${{ github.workspace }}/artifacts
          ROBOTICS_FOUNDATION_EXTRA_SERVICES: ${{ inputs.services }}
        run: bash scripts/ci/foundation/run-acceptance.sh
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: qualification-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
