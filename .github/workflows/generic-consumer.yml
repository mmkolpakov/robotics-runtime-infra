---
name: generic-caller-qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/generic-consumer.yml
      - .github/workflows/reusable-qualify.yml
      - examples/generic-consumer/**
      - scripts/ci/foundation/**
      - config/foundation-lock.json
      - .github/actions/verify-published-consumer/**
      - .github/actions/setup-buildx/**
      - compose*.yaml
      - docker/**
      - ros_ws/**
      - policy/**
      - scripts/qualification/**
      - foundation.repos
      - docker-bake.hcl
  push:
    branches: [main]
    paths:
      - .github/workflows/generic-consumer.yml
      - .github/workflows/reusable-qualify.yml
      - examples/generic-consumer/**
      - scripts/ci/foundation/**
      - config/foundation-lock.json
      - .github/actions/verify-published-consumer/**
      - .github/actions/setup-buildx/**
      - compose*.yaml
      - docker/**
      - ros_ws/**
      - policy/**
      - scripts/qualification/**
      - foundation.repos
      - docker-bake.hcl

permissions:
  contents: read

concurrency:
  group: generic-caller-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  qualify:
    uses: ./.github/workflows/reusable-qualify.yml
    with:
      tooling_ref: ${{ github.sha }}
      scenario: examples/generic-consumer/scenario.yaml
      compose_project: examples/generic-consumer/compose.yaml
      services: caller-probe
      settle_services: caller-probe
      artifact_arguments_file: examples/generic-consumer/artifact-arguments.txt

  verify-caller:
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          path: tooling
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3  # v8.0.0
        with:
          name: qualification-${{ github.sha }}
          path: ${{ runner.temp }}/generic-caller/package
      - name: Verify original custody with the published contracts and harness
        uses: ./tooling/.github/actions/verify-published-consumer
        with:
          tooling-directory: ${{ github.workspace }}/tooling
          package-directory: ${{ runner.temp }}/generic-caller/package/qualification
          authentication: ephemeral
          expected_execution_type: simulator
      - name: Check retained native caller identity and observed bytes
        env:
          PACKAGE: ${{ runner.temp }}/generic-caller/package/qualification
          REPORTS: ${{ runner.temp }}/qualification-consumer/reports
        run: |
          "${RUNNER_TEMP}/qualification-consumer/venv/bin/python" -I \
            tooling/examples/generic-consumer/verify-evidence.py "${PACKAGE}" \
            --ros-domain 0 >"${REPORTS}/generic-caller.json"
      - name: Upload independent caller observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: generic-caller-verification-${{ github.sha }}
          path: ${{ runner.temp }}/qualification-consumer/reports/
          if-no-files-found: error
          retention-days: 7
