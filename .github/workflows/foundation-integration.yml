---
name: foundation-integration

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  # yamllint disable-line rule:line-length
  group: foundation-integration-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: local
  VERSION: foundation
  SIMULATION_IMAGE: local/robotics-runtime-infra/simulation:foundation
  OBSERVER_IMAGE: local/robotics-runtime-infra/acceptance-observer:foundation
  EVIDENCE_IMAGE: local/robotics-runtime-infra/evidence-sink:foundation
  POLICY_TOOLING_IMAGE: local/robotics-runtime-infra/policy-tooling:foundation

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: false
      - uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43  # 4.0.0
        with:
          bats-version: "1.14.0"
      - uses: ./.github/actions/setup-buildx
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: v3.1.2
      - name: Set reproducible build metadata
        run: scripts/ci/set-build-metadata.sh
      - name: Import exact foundation sources
        run: bash scripts/ci/foundation/import-sources.sh
      - name: Validate contracts and simulation guard together
        run: bash scripts/ci/foundation/validate-foundation.sh
      - name: Build foundation runtime images
        run: bash scripts/ci/foundation/build-images.sh
      - name: Verify embedded foundation revisions
        run: bash scripts/ci/foundation/verify-image-lock.sh
      - name: Run scenario against the real ROS graph
        run: bash scripts/ci/foundation/run-runtime.sh
      - name: Run two isolated three-repository acceptance paths
        run: bash scripts/ci/foundation/run-acceptance-isolation.sh
      - name: Capture foundation logs
        if: always()
        run: |
          mkdir -p artifacts
          docker ps --all --no-trunc > artifacts/docker-containers.txt
          docker network ls --no-trunc > artifacts/docker-networks.txt
      - name: Upload foundation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: foundation-reports-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

  trusted-keyless-qualification:
    if: >-
      github.repository == 'mmkolpakov/robotics-runtime-infra' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      github.event_name != 'workflow_call'
    needs: foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: v3.1.2
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3  # v8.0.0
        with:
          name: foundation-reports-${{ github.sha }}
          path: artifacts
      - name: Import exact foundation sources
        run: bash scripts/ci/foundation/import-sources.sh
      - name: Sign and verify the trusted qualification bundle
        run: bash scripts/ci/foundation/run-keyless-qualification.sh
      - name: Upload trusted qualification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: foundation-keyless-qualification-${{ github.sha }}
          path: |
            artifacts/qualification-statement.json
            artifacts/qualification.keyless.sigstore.json
            artifacts/qualification-policy.json
            artifacts/qualification.trusted-root.json
          if-no-files-found: error
          retention-days: 30
