---
name: foundation-integration

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  # yamllint disable-line rule:line-length
  group: foundation-integration-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: local
  VERSION: foundation
  SIMULATION_IMAGE: local/robotics-runtime-infra/simulation:foundation
  OBSERVER_IMAGE: local/robotics-runtime-infra/acceptance-observer:foundation
  EVIDENCE_IMAGE: local/robotics-runtime-infra/evidence-sink:foundation
  POLICY_TOOLING_IMAGE: local/robotics-runtime-infra/policy-tooling:foundation

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ROBOTICS_FOUNDATION_COMPOSE_PROJECT: examples/minimal-consumer/compose.yaml
      ROBOTICS_FOUNDATION_ARTIFACT_ARGUMENTS_FILE: examples/minimal-consumer/artifact-arguments.txt
      ROBOTICS_FOUNDATION_QUALIFY_PLAYBACK: "1"
      # Explicit policy for CI validation data; no dataset license is asserted.
      ROBOTICS_CAPTURE_LICENSE: NOASSERTION
      ROBOTICS_CAPTURE_CLASSIFICATION: public
      ROBOTICS_CAPTURE_CLOCK_POLICY: ros-time-no-reset
      ROBOTICS_RETENTION_CLASS: pull-request-7d
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: false
      - uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43  # 4.0.0
        with:
          bats-version: "1.14.0"
      - uses: ./.github/actions/setup-buildx
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Set reproducible build metadata
        run: scripts/ci/set-build-metadata.sh
      - name: Import exact foundation sources
        run: bash scripts/ci/foundation/import-sources.sh
      - name: Validate contracts and simulation guard together
        run: bash scripts/ci/foundation/validate-foundation.sh
      - name: Build foundation runtime images
        run: bash scripts/ci/foundation/build-images.sh
      - name: Verify embedded foundation revisions
        run: bash scripts/ci/foundation/verify-image-lock.sh
      - name: Verify versioned S3 evidence with the installed harness
        run: bash scripts/ci/integration/verify-versioned-s3-evidence.sh
      - name: Run scenario against the real ROS graph
        run: bash scripts/ci/foundation/run-runtime.sh
      - name: Run two isolated three-repository acceptance paths
        env:
          ROBOTICS_STEP_INTERVAL_SEC: "0.01"
        run: bash scripts/ci/foundation/run-acceptance-isolation.sh
      - name: Run the default edge-attach verifier against live simulation
        run: bash scripts/ci/foundation/run-edge-attach.sh
      - name: Capture foundation logs
        if: always()
        run: |
          mkdir -p artifacts
          docker ps --all --no-trunc > artifacts/docker-containers.txt
          docker network ls --no-trunc > artifacts/docker-networks.txt
      - name: Upload foundation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: foundation-reports-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

  trusted-keyless-qualification:
    if: >-
      github.repository == 'mmkolpakov/robotics-runtime-infra' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      github.event_name != 'workflow_call'
    needs: foundation
    strategy:
      matrix:
        phase: [source, playback]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3  # v8.0.0
        with:
          name: foundation-reports-${{ github.sha }}
          path: artifacts
      - name: Import exact foundation sources
        run: bash scripts/ci/foundation/import-sources.sh
      - name: Sign and verify the trusted qualification bundle
        env:
          ROBOTICS_FOUNDATION_QUALIFICATION_PACKAGE: >-
            ${{ matrix.phase == 'source' && 'artifacts/qualification' || 'artifacts/playback/qualification' }}
        run: bash scripts/ci/foundation/run-keyless-qualification.sh
      - name: Upload trusted qualification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: >-
            ${{ matrix.phase == 'source' &&
            format('foundation-keyless-qualification-{0}', github.sha) ||
            format('foundation-keyless-playback-qualification-{0}', github.sha) }}
          path: >-
            ${{ matrix.phase == 'source' && 'artifacts/qualification/' || 'artifacts/playback/qualification/' }}
          if-no-files-found: error
          retention-days: 30


  independent-consumer:
    needs: trusted-keyless-qualification
    strategy:
      matrix:
        phase: [source, playback]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          path: tooling
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3  # v8.0.0
        with:
          name: >-
            ${{ matrix.phase == 'source' &&
            format('foundation-keyless-qualification-{0}', github.sha) ||
            format('foundation-keyless-playback-qualification-{0}', github.sha) }}
          path: ${{ runner.temp }}/qualification-consumer/package
      - name: Install the published pair outside the checkout
        run: |
          consumer="${RUNNER_TEMP}/qualification-consumer"
          mkdir "${consumer}/reports"
          versions="${GITHUB_WORKSPACE}/tooling/config/foundation-lock.json"
          contracts_version="$(jq -er '.packages.contracts.version' "${versions}")"
          harness_version="$(jq -er '.packages.harness.version' "${versions}")"
          env -i PATH="${PATH}" HOME="${HOME}" uv --no-config \
            venv --python 3.12 "${consumer}/venv"
          published_python="${consumer}/venv/bin/python"
          env -i PATH="${PATH}" HOME="${HOME}" uv --no-config pip install \
            --python "${published_python}" --no-sources \
            --default-index https://pypi.org/simple \
            "robotics-runtime-contracts[mcap]==${contracts_version}" \
            "robotics-acceptance-harness==${harness_version}"
          env -i PATH="${PATH}" HOME="${HOME}" uv --no-config pip check \
            --python "${published_python}"
          "${published_python}" -I - "${contracts_version}" "${harness_version}" \
            >"${consumer}/reports/installed-origins.json" <<'PY'
          import json
          import sys
          from importlib.metadata import version
          from pathlib import Path
          import robotics_runtime_contracts as contracts
          import robotics_acceptance_harness as harness

          observed = {}
          for distribution, module, expected in (
              ("robotics-runtime-contracts", contracts, sys.argv[1]),
              ("robotics-acceptance-harness", harness, sys.argv[2]),
          ):
              origin = Path(module.__file__).resolve()
              assert origin.is_relative_to(Path(sys.prefix).resolve())
              assert version(distribution) == expected
              observed[distribution] = {"version": expected, "origin": str(origin)}
          print(json.dumps(observed, sort_keys=True))
          PY
          chmod -R a-w "${consumer}/package"
      - name: Verify the downloaded signed package and explain its configuration
        run: |
          consumer="${RUNNER_TEMP}/qualification-consumer"
          export ROBOTICS_CONTRACTS_CLI="${consumer}/venv/bin/robotics-contracts"
          unset PYTHONPATH PYTHONHOME
          cd "${consumer}/package"
          mapfile -t qualification_inputs <qualification-arguments.txt
          tooling="${GITHUB_WORKSPACE}/tooling"
          "${tooling}/scripts/qualification/verify-bundle" \
            "${qualification_inputs[@]}" \
            --bundle "${consumer}/package/qualification.keyless.sigstore.json" \
            --trusted-root "${tooling}/trust/qualification.trusted-root.json" \
            --policy "${tooling}/trust/qualification-policy.json" \
            >"${consumer}/reports/verification.txt"
          source "${tooling}/scripts/ci/foundation/lib.sh"
          foundation_explain_qualification \
            "${consumer}/package" "${consumer}/reports/explain.json" \
            "${{ matrix.phase == 'source' && 'simulator' || 'recording_playback' }}" \
            "${consumer}/venv/bin/python" -I -m robotics_acceptance_harness.cli
      - name: Upload independent consumer observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: >-
            ${{ matrix.phase == 'source' &&
            format('foundation-independent-consumer-{0}', github.sha) ||
            format('foundation-independent-playback-consumer-{0}', github.sha) }}
          path: ${{ runner.temp }}/qualification-consumer/reports/
          if-no-files-found: error
          retention-days: 30
