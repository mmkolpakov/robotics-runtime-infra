---
name: foundation-integration

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
  pull_request:
    paths:
      - ".github/workflows/foundation-integration.yml"
      - "Dockerfile"
      - "docker-bake.hcl"
      - "docker/**"
      - "compose.yaml"
      - "compose.*.yaml"
      - "config/**"
      - "foundation.repos"
      - "foundation/**"
      - "ros_ws/**"
      - "scripts/create-acceptance-run"
      - "scripts/ci/foundation/**"
      - "test/acceptance/**"
      - "test/ci/foundation*.bats"
      - "test/observability/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/foundation-integration.yml"
      - "Dockerfile"
      - "docker-bake.hcl"
      - "docker/**"
      - "compose.yaml"
      - "compose.*.yaml"
      - "config/**"
      - "foundation.repos"
      - "foundation/**"
      - "ros_ws/**"
      - "scripts/create-acceptance-run"
      - "scripts/ci/foundation/**"
      - "test/acceptance/**"
      - "test/ci/foundation*.bats"
      - "test/observability/**"

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: foundation-integration
  cancel-in-progress: false

env:
  BUILDX_VERSION: v0.35.0
  # yamllint disable-line rule:line-length
  BUILDKIT_IMAGE: moby/buildkit:v0.31.1@sha256:6b59b7df63a8cb9902736f9ddf7fcff8261613d3e7449b8ea8b7537fc399c03a
  REGISTRY: local
  VERSION: foundation
  SIMULATION_IMAGE: local/robotics-runtime-infra/simulation:foundation
  OBSERVER_IMAGE: local/robotics-runtime-infra/acceptance-observer:foundation
  EVIDENCE_IMAGE: local/robotics-runtime-infra/evidence-sink:foundation
  # yamllint disable-line rule:line-length
  SHELLCHECK_IMAGE: koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: |
            image=${{ env.BUILDKIT_IMAGE }}
      - uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43  # 4.0.0
        with:
          bats-version: "1.14.0"
          support-install: "false"
          assert-install: "false"
          detik-install: "false"
          file-install: "false"
      - name: Check foundation phase scripts
        run: bash scripts/ci/foundation/check.sh
      - name: Set reproducible build metadata
        run: bash scripts/ci/foundation/build-metadata.sh
      - name: Import exact foundation sources
        run: bash scripts/ci/foundation/import-sources.sh
      - name: Validate contracts and simulation guard together
        run: bash scripts/ci/foundation/validate-foundation.sh
      - name: Build foundation runtime images
        run: bash scripts/ci/foundation/build-images.sh
      - name: Verify embedded foundation revisions
        run: bash scripts/ci/foundation/verify-image-lock.sh
      - name: Run scenario against the real ROS graph
        run: bash scripts/ci/foundation/run-runtime.sh
      - name: Verify two isolated projects in parallel
        run: bash scripts/ci/foundation/run-isolation.sh
      - name: Run the three-repository acceptance path
        run: bash scripts/ci/foundation/run-acceptance.sh
      - name: Verify complete Compose cleanup
        run: bash scripts/ci/foundation/verify-cleanup.sh
      - name: Capture foundation logs
        if: always()
        run: bash scripts/ci/foundation/capture-state.sh
      - name: Upload foundation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: foundation-reports-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
