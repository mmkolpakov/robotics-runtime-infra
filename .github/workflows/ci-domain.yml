---
name: ci-domain

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-domain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HADOLINT_IMAGE: hadolint/hadolint:v2.14.0@sha256:27086352fd5e1907ea2b934eb1023f217c5ae087992eb59fde121dce9c9ff21e
  # yamllint disable-line rule:line-length
  RENOVATE_IMAGE: renovate/renovate:43.257.5@sha256:3c9169d402da098f57eaf16d03947777a195bb91383d9000ad02dee92e0a0a7d
  # yamllint disable-line rule:line-length
  SHELLCHECK_IMAGE: koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d

jobs:
  consumer-examples:
    runs-on: >-
      ${{ fromJSON('{"hosted":"ubuntu-24.04","home":["self-hosted","linux","x64","robotics-ci-home"]}')
          [vars.ROBOTICS_CI_EXECUTOR || 'hosted'] }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: examples/nav2-turtlebot3
    steps:
      - name: Check CI executor and source context
        id: ci-profile
        uses: mmkolpakov/robotics-runtime-infra/.github/actions/ci-profile@b6a8138e988bfd55c513c3f6fc770adb4546dcda
        with:
          executor: ${{ vars.ROBOTICS_CI_EXECUTOR || 'hosted' }}
          architecture: x64
          runner-environment: ${{ runner.environment }}
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - name: Download and check the exact published SDK before installation
        run: |
          uv venv --python 3.12 .venv
          .venv/bin/python -I -m ensurepip --upgrade
          .venv/bin/python -I -m pip download --index-url https://pypi.org/simple \
            --require-hashes --only-binary=:all: --no-deps --dest sdk-wheels -r requirements.lock
          python3 check-sdk-wheels.py sdk-wheels
          .venv/bin/python -I -m pip install --no-index --find-links=sdk-wheels \
            --require-hashes --only-binary=:all: -r requirements.lock
          .venv/bin/python -I -m pip check
          uv build --wheel --out-dir dist evaluator
      - name: Extract the pinned vendor Cosign executable
        run: |
          mkdir -p results
          tool_index=sha256:3fad8be83b93869051c08bb98f36612afe81dabe06c288e70e41ce09a037ba18
          tool_cid=$(docker create --platform=linux/amd64 cgr.dev/chainguard/cosign@"$tool_index")
          trap 'docker rm "$tool_cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$tool_cid:/usr/bin/cosign" results/cosign
          echo '9deba5b08d25e35d107abd491f8f6c774a880d986ecfddc6761c1f9593bdaa81  results/cosign' | sha256sum -c -
          chmod 755 results/cosign
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path("results/cosign-profile.json").write_text(json.dumps({
              "executable": str(Path("results/cosign").resolve()),
              "executable_sha256": "9deba5b08d25e35d107abd491f8f6c774a880d986ecfddc6761c1f9593bdaa81",
              "version": "v3.1.3+dirty",
          }))
          PY
      - name: Authenticate the wheel before installation or consumer imports
        run: |
          ROBOTICS_COSIGN_PROFILE="$PWD/results/cosign-profile.json" \
            NAV2_EVALUATOR_WHEEL="$PWD/dist/nav2_turtlebot3_evaluator-0.3.0-py3-none-any.whl" \
            .venv/bin/python -I test_installed_cli.py --preinstall-output results/authenticated-installer
          .venv/bin/python -I -m pip install --no-index --no-deps \
            results/authenticated-installer/nav2_turtlebot3_evaluator-0.3.0-py3-none-any.whl
          .venv/bin/python -I -m pip check
      - name: Test the CI executor policy and workflow routing
        working-directory: .
        run: |
          node --test .github/actions/ci-profile/check.test.cjs
          examples/nav2-turtlebot3/.venv/bin/python -m unittest discover \
            -s test/ci -p test_home_ci_profile.py -v
      - name: Test installed document and native-boundary controls without simulation
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          node --test native-identity.test.mjs native-check.test.mjs
          NAV2_SDK_WHEELS="$PWD/sdk-wheels" \
            ROBOTICS_COSIGN_PROFILE="$PWD/results/cosign-profile.json" \
            NAV2_EVALUATOR_WHEEL="$PWD/dist/nav2_turtlebot3_evaluator-0.3.0-py3-none-any.whl" \
            .venv/bin/python -I -m unittest discover -s . -p 'test_*.py'
      - name: Test recorded Nav2 qualification and live entrypoint controls
        working-directory: .
        env:
          ROBOTICS_COSIGN_PROFILE: ${{ github.workspace }}/examples/nav2-turtlebot3/results/cosign-profile.json
        run: |
          set -- examples/nav2-turtlebot3/results/authenticated-installer/nav2_turtlebot3_evaluator-*.whl
          test "$#" -eq 1
          test -f "$1"
          test -s "$ROBOTICS_COSIGN_PROFILE"
          mkdir -p examples/nav2-regression-demo/dist
          cp "$1" examples/nav2-regression-demo/dist/
          cmp -- "$1" "examples/nav2-regression-demo/dist/${1##*/}"
          set -- examples/nav2-regression-demo/dist/nav2_turtlebot3_evaluator-*.whl
          test "$#" -eq 1
          examples/nav2-turtlebot3/.venv/bin/python -m unittest discover \
            -s examples/nav2-regression-demo -p 'test*.py' -v
      - name: Test portable X500 consumer interfaces without simulation
        working-directory: examples/px4-x500
        run: |
          npm ci --ignore-scripts --no-fund
          npm test
          ../nav2-turtlebot3/.venv/bin/python ../../host/tools/test_px4_proof_selector.py
  product-helm:
    runs-on: >-
      ${{ fromJSON('{"hosted":"ubuntu-24.04","home":["self-hosted","linux","x64","robotics-ci-home"]}')
          [vars.ROBOTICS_CI_EXECUTOR || 'hosted'] }}
    timeout-minutes: 20
    steps:
      - name: Check CI executor and source context
        id: ci-profile
        uses: mmkolpakov/robotics-runtime-infra/.github/actions/ci-profile@b6a8138e988bfd55c513c3f6fc770adb4546dcda
        with:
          executor: ${{ vars.ROBOTICS_CI_EXECUTOR || 'hosted' }}
          architecture: x64
          runner-environment: ${{ runner.environment }}
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-buildx
      - name: Check product Helm packaging without cluster access
        run: scripts/ci/check-product-helm.sh
  product-terraform:
    runs-on: >-
      ${{ fromJSON('{"hosted":"ubuntu-24.04","home":["self-hosted","linux","x64","robotics-ci-home"]}')
          [vars.ROBOTICS_CI_EXECUTOR || 'hosted'] }}
    timeout-minutes: 20
    steps:
      - name: Check CI executor and source context
        id: ci-profile
        uses: mmkolpakov/robotics-runtime-infra/.github/actions/ci-profile@b6a8138e988bfd55c513c3f6fc770adb4546dcda
        with:
          executor: ${{ vars.ROBOTICS_CI_EXECUTOR || 'hosted' }}
          architecture: x64
          runner-environment: ${{ runner.environment }}
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-buildx
      - name: Check product AWS configuration without account or backend access
        run: scripts/ci/check-product-terraform.sh
  product-ansible:
    runs-on: >-
      ${{ fromJSON('{"hosted":"ubuntu-24.04","home":["self-hosted","linux","x64","robotics-ci-home"]}')
          [vars.ROBOTICS_CI_EXECUTOR || 'hosted'] }}
    timeout-minutes: 20
    steps:
      - name: Check CI executor and source context
        id: ci-profile
        uses: mmkolpakov/robotics-runtime-infra/.github/actions/ci-profile@b6a8138e988bfd55c513c3f6fc770adb4546dcda
        with:
          executor: ${{ vars.ROBOTICS_CI_EXECUTOR || 'hosted' }}
          architecture: x64
          runner-environment: ${{ runner.environment }}
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-buildx
      - name: Check product node provisioning without applying host services
        run: scripts/ci/check-product-ansible.sh
  static-analysis:
    runs-on: >-
      ${{ fromJSON('{"hosted":"ubuntu-24.04","home":["self-hosted","linux","x64","robotics-ci-home"]}')
          [vars.ROBOTICS_CI_EXECUTOR || 'hosted'] }}
    timeout-minutes: 20
    steps:
      - name: Check CI executor and source context
        id: ci-profile
        uses: mmkolpakov/robotics-runtime-infra/.github/actions/ci-profile@b6a8138e988bfd55c513c3f6fc770adb4546dcda
        with:
          executor: ${{ vars.ROBOTICS_CI_EXECUTOR || 'hosted' }}
          architecture: x64
          runner-environment: ${{ runner.environment }}
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-buildx
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: false
      - uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43  # 4.0.0
        with:
          bats-version: "1.14.0"
      - name: Check the pinned foundation workspace
        run: bash scripts/ci/foundation/import-sources.sh
      - name: Test foundation pin generation and complete package origins
        run: |
          uv venv --python 3.12 artifacts/foundation-build-venv
          uv pip install --python artifacts/foundation-build-venv/bin/python \
            --require-hashes --no-deps -r docker/python/foundation-build.lock
          ROBOTICS_FOUNDATION_BUILD_PYTHON="${PWD}/artifacts/foundation-build-venv/bin/python" \
            python3 -m unittest discover -s test/ci -p test_workspace_pins.py -v
      - name: Install the pinned foundation CLIs for producer tests
        run: |
          uv sync --project dependencies/robotics-runtime --locked \
            --all-packages --extra mcap --no-default-groups --no-editable
          contracts_cli="${PWD}/dependencies/robotics-runtime/.venv/bin/robotics-contracts"
          echo "ROBOTICS_CONTRACTS_CLI=${contracts_cli}" >> "$GITHUB_ENV"
          echo "ROBOTICS_FOUNDATION_PYTHON=${PWD}/dependencies/robotics-runtime/.venv/bin/python" >> "$GITHUB_ENV"
      - uses: docker/setup-compose-action@16feee727cbdc83b6a014e6cc26fec4a79bcf30c  # v2.2.0
        with:
          version: v5.3.1
      - name: Test installed consumer preparation and native document boundaries
        run: |
          bash scripts/ci/host/run-installed-legacy.sh --check-config
          dependencies/robotics-runtime/.venv/bin/python -m unittest discover \
            -s host/test/fixtures/installed-webots -p test_prepare.py -v
          dependencies/robotics-runtime/.venv/bin/python \
            host/test/fixtures/installed-webots/worker/test_document_checks.py -v
      - name: Test PX4 source SDK factory inputs without loading the SDK
        run: python3 -m unittest discover -s test/ci -p test_px4_source_sdk_factory.py -v
      - name: Test simulation provider evidence
        run: >-
          dependencies/robotics-runtime/.venv/bin/python -m unittest discover
          -s test/ci -p test_simulation_provider.py -v
      - name: Test simulation control state and clock boundaries
        run: >-
          dependencies/robotics-runtime/.venv/bin/python -m unittest discover
          -s test/ci -p test_simulation_control.py -v
      - name: Test declared consumer topic configuration
        run: >-
          dependencies/robotics-runtime/.venv/bin/python -m unittest discover
          -s test/ci -p test_consumer_configuration.py -v
      - name: Test native provider qualification documents
        run: |
          NATIVE_PRODUCER_DIRECTORY="${PWD}/host/producers" \
          NATIVE_FIXTURE_DIRECTORY="${PWD}/host/test/fixtures/provider-qualification" \
          NATIVE_SCHEMA_DIRECTORY="${PWD}/config/qualification" \
          ROBOTICS_FOUNDATION_LOCK="${PWD}/config/foundation-lock.json" \
            dependencies/robotics-runtime/.venv/bin/python \
            host/test/fixtures/provider-qualification/test_native_documents.py
      - name: Test synthetic physical runtime observations
        run: >-
          dependencies/robotics-runtime/.venv/bin/python -m unittest discover
          -s test/ci -p test_physical_runtime.py -v
      - name: Test model manifest evidence binding
        run: >-
          dependencies/robotics-runtime/.venv/bin/python -m unittest discover
          -s test/ci -p test_model_manifest.py -v
      - name: Test the resolved attach verifier commands
        run: >-
          dependencies/robotics-runtime/.venv/bin/python -m unittest discover
          -s test/ci -p test_attach_commands.py -v
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Test retained artifact signatures and version binding
        run: >-
          dependencies/robotics-runtime/.venv/bin/python -m unittest discover
          -s test/ci -p test_retained_artifact.py -v
      - name: Verify the pinned Cosign publisher
        run: bash scripts/ci/static-analysis/verify-cosign-publisher.sh
      - name: Run repository hooks
        run: uvx --from pre-commit==4.6.0 pre-commit run --all-files --show-diff-on-failure
      - name: Test CI workflow architecture
        run: bats test/ci
      - name: Build and check the pinned host assets
        run: bash scripts/ci/host/build-assets.sh
      - name: Validate Docker Bake definition
        run: scripts/ci/static-analysis/validate-docker-bake-definition.sh
      - name: Build the pinned policy engine
        env:
          REGISTRY: local
          VERSION: ci
        run: |
          docker buildx bake --file docker-bake.hcl policy-tooling --load --set '*.platform=linux/amd64'
          docker run --rm local/robotics-runtime-infra/policy-tooling:ci version
      - name: Verify policies on consumer execution inputs
        run: bats test/policy/run-policy.bats
      - name: Verify policy format and unit tests
        run: scripts/ci/static-analysis/verify-policy-format-and-tests.sh
      - name: Verify execution authorization policy
        run: scripts/ci/static-analysis/verify-execution-policy.sh
      - name: Verify runtime Compose policy
        run: scripts/ci/static-analysis/verify-compose-runtime-policy.sh
      - name: Verify the consumer composition trust boundary
        run: bash scripts/ci/static-analysis/verify-foundation-consumer-policy.sh
      - name: Verify physical runtime policy
        run: scripts/ci/static-analysis/verify-physical-runtime-policy.sh
      - name: Verify host I/O policy
        run: scripts/ci/static-analysis/verify-host-io-policy.sh
      - name: Verify scenario policy
        run: scripts/ci/static-analysis/verify-scenario-policy.sh
      - name: Verify hardware workflow policy
        run: scripts/ci/static-analysis/verify-hardware-workflow-policy.sh
      - name: Lint shell entrypoints
        run: scripts/ci/static-analysis/lint-shell-entrypoints.sh
      - name: Lint the Trivy ignore policy
        run: scripts/ci/security/lint-trivyignore.sh
      - name: Lint Dockerfile
        run: >-
          docker run --rm
          --volume "${PWD}:/work:ro"
          --workdir /work
          "${HADOLINT_IMAGE}"
          /bin/hadolint --config .hadolint.yaml Dockerfile docker/rknn.Dockerfile
          docker/product-kubernetes-tools.Dockerfile
      - name: Validate Renovate configuration
        run: >-
          docker run --rm
          --volume "${PWD}:/work:ro"
          --workdir /work
          "${RENOVATE_IMAGE}"
          renovate-config-validator --strict renovate.json
      - name: Test Renovate foundation extraction and updates
        run: >-
          docker run --rm
          --volume "${PWD}:/work:ro"
          --workdir /work
          "${RENOVATE_IMAGE}"
          node test/renovate/check-pins.mjs /usr/local/renovate
      - name: Audit GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx --from zizmor==1.26.1 zizmor .github
  compose-version:
    name: compose-${{ matrix.version }}
    runs-on: >-
      ${{ fromJSON('{"hosted":"ubuntu-24.04","home":["self-hosted","linux","x64","robotics-ci-home"]}')
          [vars.ROBOTICS_CI_EXECUTOR || 'hosted'] }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        version: [v2.35.1, v5.3.1]
    steps:
      - name: Check CI executor and source context
        id: ci-profile
        uses: mmkolpakov/robotics-runtime-infra/.github/actions/ci-profile@b6a8138e988bfd55c513c3f6fc770adb4546dcda
        with:
          executor: ${{ vars.ROBOTICS_CI_EXECUTOR || 'hosted' }}
          architecture: x64
          runner-environment: ${{ runner.environment }}
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: docker/setup-compose-action@16feee727cbdc83b6a014e6cc26fec4a79bcf30c  # v2.2.0
        with:
          version: ${{ matrix.version }}
      - uses: ./.github/actions/setup-buildx
      - name: Verify Compose version
        env:
          EXPECTED_COMPOSE_VERSION: ${{ matrix.version }}
        run: >-
          test "v$(docker compose version --short | sed 's/^v//')" =
          "${EXPECTED_COMPOSE_VERSION}"
      - name: Validate every Compose model
        run: scripts/ci/validate-compose-models.sh
      - name: Build the pinned policy engine
        env:
          REGISTRY: local
          VERSION: ci
        run: >-
          docker buildx bake --file docker-bake.hcl policy-tooling --load
          --set '*.platform=linux/amd64'
      - name: Verify the consumer composition trust boundary
        run: bash scripts/ci/static-analysis/verify-foundation-consumer-policy.sh
  ci-domain:
    if: always()
    needs:
      - product-helm
      - product-terraform
      - product-ansible
      - static-analysis
      - consumer-examples
      - compose-version
    runs-on: >-
      ${{ fromJSON('{"hosted":"ubuntu-24.04","home":["self-hosted","linux","x64","robotics-ci-home"]}')
          [vars.ROBOTICS_CI_EXECUTOR || 'hosted'] }}
    timeout-minutes: 5
    steps:
      - name: Check CI executor and source context
        id: ci-profile
        uses: mmkolpakov/robotics-runtime-infra/.github/actions/ci-profile@b6a8138e988bfd55c513c3f6fc770adb4546dcda
        with:
          executor: ${{ vars.ROBOTICS_CI_EXECUTOR || 'hosted' }}
          architecture: x64
          runner-environment: ${{ runner.environment }}
      - name: Require every domain gate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: printf '%s\n' "${NEEDS_JSON}" | jq -e 'all(.[]; .result == "success")'
