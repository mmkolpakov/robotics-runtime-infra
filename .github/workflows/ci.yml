---
name: ci

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HADOLINT_IMAGE: hadolint/hadolint:v2.14.0@sha256:27086352fd5e1907ea2b934eb1023f217c5ae087992eb59fde121dce9c9ff21e
  # yamllint disable-line rule:line-length
  RENOVATE_IMAGE: renovate/renovate:43.257.5@sha256:3c9169d402da098f57eaf16d03947777a195bb91383d9000ad02dee92e0a0a7d
  ROBOTICS_CONTRACTS_REQUIREMENT: >-
    robotics-runtime-contracts @
    https://github.com/mmkolpakov/robotics-runtime-contracts/releases/download/v0.14.0/robotics_runtime_contracts-0.14.0-py3-none-any.whl#sha256=a4ce170995432807d8210c5d4bfea18f370d49a38f79852013946488f26416db
  # yamllint disable-line rule:line-length
  SHELLCHECK_IMAGE: koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
  TRIVY_IMAGE: aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f

jobs:
  static-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-buildx
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: false
      - uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43  # 4.0.0
        with:
          bats-version: "1.14.0"
      - name: Run repository hooks
        run: uvx --from pre-commit==4.6.0 pre-commit run --all-files --show-diff-on-failure
      - name: Test CI workflow architecture
        run: bats test/ci
      - name: Validate Docker Bake definition
        run: scripts/ci/static-analysis/validate-docker-bake-definition.sh
      - name: Build the pinned policy engine
        env:
          REGISTRY: local
          VERSION: ci
        run: |
          docker buildx bake --file docker-bake.hcl policy-tooling --load --set '*.platform=linux/amd64'
          docker run --rm local/robotics-runtime-infra/policy-tooling:ci version
      - name: Verify policy format and unit tests
        run: scripts/ci/static-analysis/verify-policy-format-and-tests.sh
      - name: Verify execution authorization policy
        run: scripts/ci/static-analysis/verify-execution-policy.sh
      - name: Verify runtime Compose policy
        run: scripts/ci/static-analysis/verify-compose-runtime-policy.sh
      - name: Verify physical runtime policy
        run: scripts/ci/static-analysis/verify-physical-runtime-policy.sh
      - name: Verify host I/O policy
        run: scripts/ci/static-analysis/verify-host-io-policy.sh
      - name: Verify scenario policy
        run: scripts/ci/static-analysis/verify-scenario-policy.sh
      - name: Verify hardware workflow policy
        run: scripts/ci/static-analysis/verify-hardware-workflow-policy.sh
      - name: Lint shell entrypoints
        run: scripts/ci/static-analysis/lint-shell-entrypoints.sh
      - name: Lint Dockerfile
        run: >-
          docker run --rm
          --volume "${PWD}:/work:ro"
          --workdir /work
          "${HADOLINT_IMAGE}"
          /bin/hadolint --config .hadolint.yaml Dockerfile docker/rknn.Dockerfile
      - name: Validate Renovate configuration
        run: >-
          docker run --rm
          --volume "${PWD}:/work:ro"
          --workdir /work
          "${RENOVATE_IMAGE}"
          renovate-config-validator --strict renovate.json
      - name: Audit GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx --from zizmor==1.26.1 zizmor .github
  compose-version:
    name: compose-${{ matrix.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        version: [v2.35.1, v5.3.1]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: docker/setup-compose-action@16feee727cbdc83b6a014e6cc26fec4a79bcf30c  # v2.2.0
        with:
          version: ${{ matrix.version }}
      - name: Verify Compose version
        env:
          EXPECTED_COMPOSE_VERSION: ${{ matrix.version }}
        run: >-
          test "v$(docker compose version --short | sed 's/^v//')" =
          "${EXPECTED_COMPOSE_VERSION}"
      - name: Validate every Compose model
        run: scripts/ci/validate-compose-models.sh
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      COMPOSE_PROJECT_NAME: runtime-infra-${{ github.run_id }}-${{ github.run_attempt }}
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      VERSION: ci
      SIMULATION_IMAGE: ghcr.io/${{ github.repository_owner }}/robotics-runtime-infra/simulation:ci
      EDGE_IMAGE: ghcr.io/${{ github.repository_owner }}/robotics-runtime-infra/edge:ci
      SENSOR_IMAGE: ghcr.io/${{ github.repository_owner }}/robotics-runtime-infra/sensor:ci
      INFERENCE_CPU_IMAGE: ghcr.io/${{ github.repository_owner }}/robotics-runtime-infra/inference-cpu:ci
      # yamllint disable-line rule:line-length
      INFERENCE_CPU_CONFORMANCE_IMAGE: ghcr.io/${{ github.repository_owner }}/robotics-runtime-infra/provider-conformance-cpu:ci
      # yamllint disable-line rule:line-length
      SENSOR_INFERENCE_IMAGE: ghcr.io/${{ github.repository_owner }}/robotics-runtime-infra/sensor-inference-cpu:ci
      # yamllint disable-line rule:line-length
      OBSERVER_IMAGE: ghcr.io/${{ github.repository_owner }}/robotics-runtime-infra/acceptance-observer:ci
      BENCHMARK_IMAGE: ghcr.io/${{ github.repository_owner }}/robotics-runtime-infra/benchmark:ci
      EVIDENCE_IMAGE: ghcr.io/${{ github.repository_owner }}/robotics-runtime-infra/evidence-sink:ci
      # yamllint disable-line rule:line-length
      PERMIT_PREFLIGHT_IMAGE: ghcr.io/${{ github.repository_owner }}/robotics-runtime-infra/permit-preflight:ci
      # yamllint disable-line rule:line-length
      PERMIT_PREFLIGHT_CI_IMAGE: ghcr.io/${{ github.repository_owner }}/robotics-runtime-infra/permit-preflight-ci:ci
      HOST_IO_FIXTURE_IMAGE: ghcr.io/${{ github.repository_owner }}/robotics-runtime-infra/host-io-fixture:ci
      # yamllint disable-line rule:line-length
      CAN_CLIENT_IMAGE: busybox:1.37.0-musl@sha256:222ad6d973c0d198014546a65cd02c5fdedcc172123c5b4c2bf0af636550bd94
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-buildx
      - name: Set reproducible build metadata
        run: scripts/ci/set-build-metadata.sh
      - name: Build the amd64 CPU product
        run: >-
          docker buildx bake --file docker-bake.hcl cpu ci-only
          --load
          --set '*.platform=linux/amd64'
          --set '*.cache-from=type=gha,scope=runtime-infra-amd64'
          --set '*.cache-to=type=gha,mode=max,scope=runtime-infra-amd64'
      - name: Verify portable runtime images
        run: scripts/ci/integration/verify-portable-runtime-images.sh
      - name: Verify host time evidence
        run: scripts/ci/integration/verify-host-time-evidence.sh
      - name: Verify Cosign DSSE boundary and tamper rejection
        env:
          COSIGN_PASSWORD: test-only
        run: scripts/ci/integration/verify-cosign-dsse-boundary-and-tamper-rejection.sh
      - name: Verify synthetic physical attach end to end
        env:
          COSIGN_PASSWORD: test-only
        run: scripts/ci/integration/verify-synthetic-physical-attach-end-to-end.sh
      - name: Verify CPU provider identity and tensor parity
        run: scripts/ci/integration/verify-cpu-provider-identity-and-tensor-parity.sh
      - name: Run ROS and Gazebo acceptance tests
        run: scripts/ci/integration/run-ros-and-gazebo-acceptance-tests.sh
      - name: Verify MCAP playback
        run: scripts/ci/integration/verify-mcap-playback.sh
      - name: Verify the local high-throughput profile
        run: scripts/ci/integration/verify-the-local-high-throughput-profile.sh
      - name: Verify cross-domain Trace Context transport
        run: test/zenoh/run
      - name: Benchmark the supported ROS data planes
        run: scripts/ci/integration/benchmark-the-supported-ros-data-planes.sh
      - name: Verify SROS2 enforcement
        run: scripts/ci/integration/verify-sros2-enforcement.sh
      - name: Verify versioned S3 evidence
        run: scripts/ci/integration/verify-versioned-s3-evidence.sh
      - name: Capture runtime evidence
        if: always()
        run: scripts/ci/integration/capture-runtime-evidence.sh
      - name: Scan images and enforce vulnerability policy
        run: scripts/ci/security/scan-bake-group.sh cpu
      - name: Scan CI-only images and enforce vulnerability policy
        run: scripts/ci/security/scan-bake-group.sh ci-only
      - name: Stop runtime
        if: always()
        run: docker compose --profile test --profile acceptance down --volumes --remove-orphans
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: runtime-infra-reports-${{ github.sha }}
          # Generated SROS2 keys and physical authorization inputs are never artifacts.
          path: |
            artifacts/benchmarks/
            artifacts/evidence-s3/evidence-index.json
            artifacts/provider-conformance/
            artifacts/runtime/
            artifacts/security/
            artifacts/test-results/
          if-no-files-found: warn
          retention-days: 7

  nvidia-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      VERSION: nvidia-ci
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-buildx
      - name: Set reproducible build metadata
        run: scripts/ci/set-build-metadata.sh
      - name: Build the NVIDIA runtime image
        run: >-
          docker buildx bake --file docker-bake.hcl nvidia
          --load
          --set '*.platform=linux/amd64'
          --set '*.cache-from=type=gha,scope=runtime-infra-nvidia-amd64'
          --set '*.cache-to=type=gha,mode=max,scope=runtime-infra-nvidia-amd64'
      - name: Verify the ONNX Runtime GPU ABI
        run: scripts/ci/nvidia-image/verify-the-onnx-runtime-gpu-abi.sh
      - name: Scan NVIDIA runtime images
        run: scripts/ci/security/scan-bake-group.sh nvidia
      - name: Upload NVIDIA scan results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: security-nvidia-${{ github.sha }}
          path: artifacts/security/
          if-no-files-found: error
          retention-days: 7
  nvidia-jetson-supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-buildx
      - name: Verify pinned NVIDIA base manifests
        run: scripts/ci/nvidia-jetson-supply-chain/verify-pinned-nvidia-base-manifests.sh
      - name: Resolve and verify the ONNX Runtime source context
        run: >-
          docker buildx bake --file docker-bake.hcl onnxruntime-jetson-source-verification
          --set '*.output=type=cacheonly'
          --set '*.cache-from=type=gha,scope=runtime-infra-onnxruntime-source'
          --set '*.cache-to=type=gha,mode=max,scope=runtime-infra-onnxruntime-source'
      - name: Verify the Jetson dependency policy
        run: scripts/ci/nvidia-jetson-supply-chain/verify-the-jetson-dependency-policy.sh
      - name: Validate the Jetson build graph
        run: docker buildx bake --file docker-bake.hcl --print nvidia-jetson >/dev/null

  rknn-supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-buildx
      - name: Verify the RKNN source and dependency policy
        run: scripts/ci/rknn-supply-chain/verify-the-rknn-source-and-dependency-policy.sh
      - name: Run the official RKNN conversion fixture
        run: >-
          docker buildx bake --file docker-bake.hcl rknn-converter-verification
          --set '*.output=type=cacheonly'
  rknn-arm64-image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      VERSION: rknn-ci
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-buildx
      - name: Require the native ARM64 runner
        run: test "$(uname -m)" = aarch64
      - name: Build the RK3588 runtime without publishing vendor artifacts
        run: >-
          docker buildx bake --file docker-bake.hcl
          inference-rknn-rk3588
          provider-conformance-rknn-rk3588
          --set '*.output=type=docker'
      - name: Scan RK3588 runtime images
        run: scripts/ci/security/scan-bake-group.sh rknn
      - name: Upload RK3588 scan results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: security-rknn-${{ github.sha }}
          path: artifacts/security/
          if-no-files-found: error
          retention-days: 7
  amd-supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      VERSION: amd-ci
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-buildx
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: false
      - name: Verify the signed ROCm package channel
        run: scripts/ci/amd-supply-chain/verify-the-signed-rocm-package-channel.sh
      - name: Verify the locked AMD wheel
        run: scripts/ci/amd-supply-chain/verify-the-locked-amd-wheel.sh
      - name: Build the AMD runtime and conformance images
        run: >-
          docker buildx bake --file docker-bake.hcl amd
          --set '*.platform=linux/amd64'
          --set '*.output=type=docker'
          --set 'inference-amd.cache-from=type=gha,scope=runtime-infra-amd-amd64'
          --set 'provider-conformance-amd.cache-from=type=gha,scope=runtime-infra-amd-amd64'
          --set 'provider-conformance-amd.cache-to=type=gha,mode=max,scope=runtime-infra-amd-amd64'
      - name: Scan AMD runtime images
        run: scripts/ci/security/scan-bake-group.sh amd
      - name: Upload AMD scan results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: security-amd-${{ github.sha }}
          path: artifacts/security/
          if-no-files-found: error
          retention-days: 7
  intel-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      VERSION: intel-ci
      # yamllint disable-line rule:line-length
      INFERENCE_INTEL_CPU_IMAGE: ghcr.io/${{ github.repository_owner }}/robotics-runtime-infra/inference-intel-cpu:intel-ci
      # yamllint disable-line rule:line-length
      INFERENCE_INTEL_GPU_IMAGE: ghcr.io/${{ github.repository_owner }}/robotics-runtime-infra/inference-intel-gpu:intel-ci
      # yamllint disable-line rule:line-length
      INFERENCE_INTEL_CPU_CONFORMANCE_IMAGE: ghcr.io/${{ github.repository_owner }}/robotics-runtime-infra/provider-conformance-intel-cpu:intel-ci
      # yamllint disable-line rule:line-length
      INFERENCE_INTEL_GPU_CONFORMANCE_IMAGE: ghcr.io/${{ github.repository_owner }}/robotics-runtime-infra/provider-conformance-intel-gpu:intel-ci
      # yamllint disable-line rule:line-length
      SENSOR_INFERENCE_INTEL_CPU_IMAGE: ghcr.io/${{ github.repository_owner }}/robotics-runtime-infra/sensor-inference-intel-cpu:intel-ci
      # yamllint disable-line rule:line-length
      SIMULATION_IMAGE: ghcr.io/${{ github.repository_owner }}/robotics-runtime-infra/simulation:intel-ci
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-buildx
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: false
      - name: Set reproducible build metadata
        run: scripts/ci/set-build-metadata.sh
      - name: Build the Intel runtime and conformance images
        run: >-
          docker buildx bake --file docker-bake.hcl intel simulation
          --load
          --set '*.platform=linux/amd64'
          --set '*.cache-from=type=gha,scope=runtime-infra-intel-amd64'
          --set '*.cache-to=type=gha,mode=max,scope=runtime-infra-intel-amd64'
      - name: Verify OpenVINO CPU execution without fallback
        run: scripts/ci/intel-image/verify-openvino-cpu-execution-without-fallback.sh
      - name: Verify the OpenVINO CPU sensor path
        env:
          ROBOTICS_ACCELERATOR: intel-cpu
          ROBOTICS_BUILD_IMAGES: "0"
        run: test/accelerators/run-sensor-inference
      - name: Validate Intel runtime evidence
        run: |
          source scripts/ci/lib.sh
          ci_validate_contract_documents \
            artifacts/sensor-inference/runtime-manifest.json \
            artifacts/sensor-inference/model/model-manifest.json
      - name: Scan Intel runtime images
        run: scripts/ci/security/scan-bake-group.sh intel
      - name: Upload Intel scan results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: security-intel-${{ github.sha }}
          path: |
            artifacts/provider-conformance/intel-cpu/
            artifacts/security/
            artifacts/sensor-inference/
          if-no-files-found: error
          retention-days: 7
  portable-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      VERSION: arm64-ci
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-buildx
        with:
          qemu: "true"
      - name: Set reproducible build metadata
        run: scripts/ci/set-build-metadata.sh
      - name: Build and scan every portable target for ARM64
        run: >-
          scripts/ci/security/scan-bake-group.sh multiarch linux/arm64
          --set '*.cache-from=type=gha,scope=runtime-infra-arm64'
          --set '*.cache-to=type=gha,mode=max,scope=runtime-infra-arm64'
      - name: Upload portable ARM64 scan results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: security-portable-arm64-${{ github.sha }}
          path: artifacts/security/
          if-no-files-found: error
          retention-days: 7
  reproducibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-buildx
      - name: Rebuild the same OCI image twice
        run: scripts/ci/reproducibility/rebuild-the-same-oci-image-twice.sh
  ci:
    if: always()
    needs:
      - static-analysis
      - compose-version
      - integration
      - amd-supply-chain
      - intel-image
      - nvidia-image
      - nvidia-jetson-supply-chain
      - rknn-supply-chain
      - rknn-arm64-image
      - portable-arm64
      - reproducibility
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every CI gate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: printf '%s\n' "${NEEDS_JSON}" | jq -e 'all(.[]; .result == "success")'
