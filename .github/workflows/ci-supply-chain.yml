---
name: ci-supply-chain

on:
  workflow_call:
    inputs:
      force:
        description: Run the full build and scan regardless of changed paths.
        type: boolean
        default: false
      native_ust_trace:
        description: Capture diagnostic ROS userspace traces
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      force:
        description: Run the full build and scan regardless of changed paths.
        type: boolean
        default: false
      native_ust_trace:
        description: Capture diagnostic ROS userspace traces
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      affected: ${{ steps.classify.outputs.affected }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Determine whether image inputs are affected
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          forced=false
          if test "${FORCE}" = "true"; then
            forced=true
          elif test "${EVENT_NAME}" = pull_request; then
            git fetch --no-tags origin "${BASE_REF}"
            base="$(git merge-base FETCH_HEAD HEAD)"
            git diff --name-only "${base}" HEAD >changed-paths.txt || forced=true
          elif test "${EVENT_NAME}" = push && [[ "${BEFORE_SHA}" =~ ^0+$ ]]; then
            forced=true
          elif test "${EVENT_NAME}" = push; then
            git diff --name-only "${BEFORE_SHA}" HEAD >changed-paths.txt || forced=true
          else
            git diff --name-only HEAD~1 HEAD >changed-paths.txt || forced=true
          fi
          if test "${forced}" = true; then
            printf 'affected=true\n' >>"${GITHUB_OUTPUT}"
            printf 'supply chain: full build+scan (forced or diff unavailable)\n' >>"${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          scripts/ci/supply-chain/image-inputs.sh classify --github-output <changed-paths.txt
          if grep -Fxq 'affected=false' "${GITHUB_OUTPUT}"; then
            printf 'supply chain: not affected — image inputs unchanged\n' >>"${GITHUB_STEP_SUMMARY}"
          else
            printf 'supply chain: image inputs affected — full build+scan\n' >>"${GITHUB_STEP_SUMMARY}"
          fi
  integration:
    needs: changes
    if: needs.changes.outputs.affected == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      COMPOSE_PROJECT_NAME: runtime-infra-${{ github.run_id }}-${{ github.run_attempt }}
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      VERSION: ci
      SIMULATION_IMAGE: ghcr.io/${{ github.repository_owner }}/robotics-runtime-infra/simulation:ci
      EDGE_IMAGE: ghcr.io/${{ github.repository_owner }}/robotics-runtime-infra/edge:ci
      SENSOR_IMAGE: ghcr.io/${{ github.repository_owner }}/robotics-runtime-infra/sensor:ci
      INFERENCE_CPU_IMAGE: ghcr.io/${{ github.repository_owner }}/robotics-runtime-infra/inference-cpu:ci
      # yamllint disable-line rule:line-length
      INFERENCE_CPU_CONFORMANCE_IMAGE: ghcr.io/${{ github.repository_owner }}/robotics-runtime-infra/provider-conformance-cpu:ci
      # yamllint disable-line rule:line-length
      SENSOR_INFERENCE_IMAGE: ghcr.io/${{ github.repository_owner }}/robotics-runtime-infra/sensor-inference-cpu:ci
      # yamllint disable-line rule:line-length
      OBSERVER_IMAGE: ghcr.io/${{ github.repository_owner }}/robotics-runtime-infra/acceptance-observer:ci
      BENCHMARK_IMAGE: ghcr.io/${{ github.repository_owner }}/robotics-runtime-infra/benchmark:ci
      EVIDENCE_IMAGE: ghcr.io/${{ github.repository_owner }}/robotics-runtime-infra/evidence-sink:ci
      # yamllint disable-line rule:line-length
      PERMIT_PREFLIGHT_IMAGE: ghcr.io/${{ github.repository_owner }}/robotics-runtime-infra/permit-preflight:ci
      # yamllint disable-line rule:line-length
      PERMIT_PREFLIGHT_CI_IMAGE: ghcr.io/${{ github.repository_owner }}/robotics-runtime-infra/permit-preflight-ci:ci
      HOST_IO_FIXTURE_IMAGE: ghcr.io/${{ github.repository_owner }}/robotics-runtime-infra/host-io-fixture:ci
      # yamllint disable-line rule:line-length
      CAN_CLIENT_IMAGE: busybox:1.37.0-musl@sha256:222ad6d973c0d198014546a65cd02c5fdedcc172123c5b4c2bf0af636550bd94
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-buildx
      - name: Set reproducible build metadata
        run: scripts/ci/set-build-metadata.sh
      - name: Build the amd64 CPU product
        run: >-
          scripts/ci/supply-chain/run-guarded.sh
          docker buildx bake --file docker-bake.hcl cpu ci-only
          --load
          --set '*.platform=linux/amd64'
          --set '*.cache-from=type=gha,scope=runtime-infra-amd64'
          --set '*.cache-to=type=gha,mode=max,scope=runtime-infra-amd64'
      - name: Verify portable runtime images
        run: scripts/ci/integration/verify-portable-runtime-images.sh
      - name: Verify Cosign DSSE boundary and tamper rejection
        env:
          COSIGN_PASSWORD: test-only
        run: scripts/ci/integration/verify-cosign-dsse-boundary-and-tamper-rejection.sh
      - name: Verify logged permit authorization and denial boundaries
        env:
          COSIGN_PASSWORD: test-only
        run: bash scripts/ci/integration/verify-logged-permit-preflight.sh
      - name: Prepare synthetic physical attach prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends can-utils socat
          if ! sudo modprobe vcan; then
            sudo apt-get install -y --no-install-recommends \
              "linux-modules-extra-$(uname -r)"
            sudo modprobe vcan
          fi
      - name: Verify host time evidence
        run: scripts/ci/integration/verify-host-time-evidence.sh
      - name: Verify synthetic physical attach end to end
        env:
          COSIGN_PASSWORD: test-only
        run: scripts/ci/integration/verify-synthetic-physical-attach-end-to-end.sh
      - name: Verify CPU provider identity and tensor parity
        run: scripts/ci/integration/verify-cpu-provider-identity-and-tensor-parity.sh
      - name: Run ROS and Gazebo acceptance tests
        run: scripts/ci/integration/run-ros-and-gazebo-acceptance-tests.sh
      - name: Verify MCAP playback
        run: scripts/ci/integration/verify-mcap-playback.sh
      - name: Verify the local high-throughput profile
        run: scripts/ci/integration/verify-the-local-high-throughput-profile.sh
      - name: Verify cross-domain Trace Context transport
        run: test/zenoh/run
      - name: Benchmark the supported ROS data planes
        run: scripts/ci/integration/benchmark-the-supported-ros-data-planes.sh
      - name: Verify SROS2 enforcement
        run: scripts/ci/integration/verify-sros2-enforcement.sh
      - name: Verify versioned S3 evidence
        run: scripts/ci/integration/verify-versioned-s3-evidence.sh
      - name: Capture runtime evidence
        if: always()
        run: scripts/ci/integration/capture-runtime-evidence.sh
      - name: Scan images and enforce vulnerability policy
        run: scripts/ci/supply-chain/run-guarded.sh scripts/ci/security/scan-bake-group.sh cpu
      - name: Scan CI-only images and enforce vulnerability policy
        run: scripts/ci/supply-chain/run-guarded.sh scripts/ci/security/scan-bake-group.sh ci-only
      - name: Stop runtime
        if: always()
        run: docker compose --profile test --profile acceptance down --volumes --remove-orphans
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: runtime-infra-reports-${{ github.sha }}
          # Generated SROS2 keys and physical authorization inputs are never artifacts.
          path: |
            artifacts/benchmarks/
            artifacts/evidence-s3/
            artifacts/host-time/
            artifacts/provider-conformance/
            artifacts/runtime/
            artifacts/security/
            artifacts/test-results/
            artifacts/zenoh/
          if-no-files-found: warn
          retention-days: 7

  nvidia-image:
    needs: changes
    if: needs.changes.outputs.affected == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      VERSION: nvidia-ci
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-buildx
      - name: Set reproducible build metadata
        run: scripts/ci/set-build-metadata.sh
      - name: Build the NVIDIA runtime image
        run: >-
          scripts/ci/supply-chain/run-guarded.sh
          docker buildx bake --file docker-bake.hcl nvidia
          --load
          --set '*.platform=linux/amd64'
          --set '*.cache-from=type=gha,scope=runtime-infra-nvidia-amd64'
          --set '*.cache-to=type=gha,mode=max,scope=runtime-infra-nvidia-amd64'
      - name: Verify the ONNX Runtime GPU ABI
        run: scripts/ci/nvidia-image/verify-the-onnx-runtime-gpu-abi.sh
      - name: Scan NVIDIA runtime images
        run: scripts/ci/supply-chain/run-guarded.sh scripts/ci/security/scan-bake-group.sh nvidia
      - name: Upload NVIDIA scan results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: security-nvidia-${{ github.sha }}
          path: artifacts/security/
          if-no-files-found: error
          retention-days: 7
  nvidia-jetson-supply-chain:
    needs: changes
    if: needs.changes.outputs.affected == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-buildx
      - name: Verify pinned NVIDIA base manifests
        run: scripts/ci/nvidia-jetson-supply-chain/verify-pinned-nvidia-base-manifests.sh
      - name: Resolve and verify the ONNX Runtime source context
        run: >-
          scripts/ci/supply-chain/run-guarded.sh
          docker buildx bake --file docker-bake.hcl onnxruntime-jetson-source-verification
          --set '*.output=type=cacheonly'
          --set '*.cache-from=type=gha,scope=runtime-infra-onnxruntime-source'
          --set '*.cache-to=type=gha,mode=max,scope=runtime-infra-onnxruntime-source'
      - name: Verify the Jetson dependency policy
        run: scripts/ci/nvidia-jetson-supply-chain/verify-the-jetson-dependency-policy.sh
      - name: Validate the Jetson build graph
        run: docker buildx bake --file docker-bake.hcl --print nvidia-jetson >/dev/null

  rknn-supply-chain:
    needs: changes
    if: needs.changes.outputs.affected == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-buildx
      - name: Verify the RKNN source and dependency policy
        run: scripts/ci/rknn-supply-chain/verify-the-rknn-source-and-dependency-policy.sh
      - name: Run the official RKNN conversion fixture
        run: >-
          scripts/ci/supply-chain/run-guarded.sh
          docker buildx bake --file docker-bake.hcl rknn-converter-verification
          --set '*.output=type=cacheonly'
  rknn-arm64-image:
    needs: changes
    if: needs.changes.outputs.affected == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      VERSION: rknn-ci
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-buildx
      - name: Require the native ARM64 runner
        run: test "$(uname -m)" = aarch64
      - name: Set reproducible build metadata
        run: scripts/ci/set-build-metadata.sh
      - name: Build the RK3588 runtime without publishing vendor artifacts
        run: >-
          scripts/ci/supply-chain/run-guarded.sh
          docker buildx bake --file docker-bake.hcl
          inference-rknn-rk3588
          provider-conformance-rknn-rk3588
          --set '*.output=type=docker'
      - name: Scan RK3588 runtime images
        run: scripts/ci/supply-chain/run-guarded.sh scripts/ci/security/scan-bake-group.sh rknn
      - name: Upload RK3588 scan results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: security-rknn-${{ github.sha }}
          path: artifacts/security/
          if-no-files-found: error
          retention-days: 7
  amd-supply-chain:
    needs: changes
    if: needs.changes.outputs.affected == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      VERSION: amd-ci
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-buildx
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: false
      - name: Verify the signed ROCm package channel
        run: scripts/ci/amd-supply-chain/verify-the-signed-rocm-package-channel.sh
      - name: Verify the locked AMD wheel
        run: scripts/ci/amd-supply-chain/verify-the-locked-amd-wheel.sh
      - name: Set reproducible build metadata
        run: scripts/ci/set-build-metadata.sh
      - name: Build the AMD runtime and conformance images
        run: >-
          scripts/ci/supply-chain/run-guarded.sh
          docker buildx bake --file docker-bake.hcl amd
          --set '*.platform=linux/amd64'
          --set '*.output=type=docker'
          --set 'inference-amd.cache-from=type=gha,scope=runtime-infra-amd-amd64'
          --set 'provider-conformance-amd.cache-from=type=gha,scope=runtime-infra-amd-amd64'
          --set 'provider-conformance-amd.cache-to=type=gha,mode=max,scope=runtime-infra-amd-amd64'
      - name: Scan AMD runtime images
        run: scripts/ci/supply-chain/run-guarded.sh scripts/ci/security/scan-bake-group.sh amd
      - name: Upload AMD scan results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: security-amd-${{ github.sha }}
          path: artifacts/security/
          if-no-files-found: error
          retention-days: 7
  intel-image:
    needs: changes
    if: needs.changes.outputs.affected == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      VERSION: intel-ci
      # yamllint disable-line rule:line-length
      INFERENCE_INTEL_CPU_IMAGE: ghcr.io/${{ github.repository_owner }}/robotics-runtime-infra/inference-intel-cpu:intel-ci
      # yamllint disable-line rule:line-length
      INFERENCE_INTEL_GPU_IMAGE: ghcr.io/${{ github.repository_owner }}/robotics-runtime-infra/inference-intel-gpu:intel-ci
      # yamllint disable-line rule:line-length
      INFERENCE_INTEL_CPU_CONFORMANCE_IMAGE: ghcr.io/${{ github.repository_owner }}/robotics-runtime-infra/provider-conformance-intel-cpu:intel-ci
      # yamllint disable-line rule:line-length
      INFERENCE_INTEL_GPU_CONFORMANCE_IMAGE: ghcr.io/${{ github.repository_owner }}/robotics-runtime-infra/provider-conformance-intel-gpu:intel-ci
      # yamllint disable-line rule:line-length
      SENSOR_INFERENCE_INTEL_CPU_IMAGE: ghcr.io/${{ github.repository_owner }}/robotics-runtime-infra/sensor-inference-intel-cpu:intel-ci
      # yamllint disable-line rule:line-length
      SIMULATION_IMAGE: ghcr.io/${{ github.repository_owner }}/robotics-runtime-infra/simulation:intel-ci
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-buildx
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: false
      - name: Set reproducible build metadata
        run: scripts/ci/set-build-metadata.sh
      - name: Build the Intel runtime and conformance images
        run: >-
          scripts/ci/supply-chain/run-guarded.sh
          docker buildx bake --file docker-bake.hcl intel simulation
          --load
          --set '*.platform=linux/amd64'
          --set '*.cache-from=type=gha,scope=runtime-infra-intel-amd64'
          --set '*.cache-to=type=gha,mode=max,scope=runtime-infra-intel-amd64'
      - name: Verify OpenVINO CPU execution without fallback
        run: scripts/ci/intel-image/verify-openvino-cpu-execution-without-fallback.sh
      - name: Verify the OpenVINO CPU sensor path
        env:
          ROBOTICS_ACCELERATOR: intel-cpu
          ROBOTICS_BUILD_IMAGES: "0"
        run: test/accelerators/run-sensor-inference
      - name: Validate Intel runtime evidence
        run: |
          source scripts/ci/lib.sh
          ci_validate_contract_documents \
            artifacts/sensor-inference/runtime-manifest.json \
            artifacts/sensor-inference/model/model-manifest.json
      - name: Scan Intel runtime images
        run: scripts/ci/supply-chain/run-guarded.sh scripts/ci/security/scan-bake-group.sh intel
      - name: Upload Intel scan results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: security-intel-${{ github.sha }}
          path: |
            artifacts/provider-conformance/intel-cpu/
            artifacts/security/
            artifacts/sensor-inference/
          if-no-files-found: error
          retention-days: 7
  portable-arm64:
    needs: changes
    if: needs.changes.outputs.affected == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      VERSION: arm64-ci
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-buildx
      - name: Require the native ARM64 runner
        run: test "$(uname -m)" = aarch64
      - name: Set reproducible build metadata
        run: scripts/ci/set-build-metadata.sh
      - name: Build and scan every portable target for ARM64
        run: >-
          scripts/ci/supply-chain/run-guarded.sh
          scripts/ci/security/scan-bake-group.sh multiarch linux/arm64
          --set '*.cache-from=type=gha,scope=runtime-infra-arm64'
          --set '*.cache-to=type=gha,mode=max,scope=runtime-infra-arm64'
      - name: Upload portable ARM64 scan results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: security-portable-arm64-${{ github.sha }}
          path: artifacts/security/
          if-no-files-found: error
          retention-days: 7
  reproducibility:
    needs: changes
    if: needs.changes.outputs.affected == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-buildx
      - name: Install the pinned OCI comparison tool
        env:
          DIFFOCI_VERSION: v0.1.8
          DIFFOCI_SHA256: 01e6b50c1568c9d61c758ef6da81869f2c26c852698d73dca961b3617effe949
        run: |
          mkdir -p "${RUNNER_TEMP}/diffoci-bin"
          binary="${RUNNER_TEMP}/diffoci-bin/diffoci"
          curl --fail --location --retry 3 --output "${binary}" \
            "https://github.com/reproducible-containers/diffoci/releases/download/${DIFFOCI_VERSION}/diffoci-${DIFFOCI_VERSION}.linux-amd64"
          printf '%s  %s\n' "${DIFFOCI_SHA256}" "${binary}" | sha256sum --check --strict
          chmod 0555 "${binary}"
          printf '%s\n' "${RUNNER_TEMP}/diffoci-bin" >>"${GITHUB_PATH}"
      - name: Rebuild the same OCI image twice
        run: >-
          scripts/ci/supply-chain/run-guarded.sh
          scripts/ci/reproducibility/rebuild-the-same-oci-image-twice.sh
      - name: Upload OCI manifests and file differences
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: reproducibility-${{ github.sha }}
          path: artifacts/reproducibility/
          if-no-files-found: warn
          retention-days: 7
  foundation:
    needs: changes
    if: needs.changes.outputs.affected == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      evidence-artifact-id: ${{ steps.upload-foundation-evidence.outputs.artifact-id }}
    env:
      REGISTRY: local
      VERSION: foundation
      SIMULATION_IMAGE: local/robotics-runtime-infra/simulation:foundation
      OBSERVER_IMAGE: local/robotics-runtime-infra/acceptance-observer:foundation
      EVIDENCE_IMAGE: local/robotics-runtime-infra/evidence-sink:foundation
      POLICY_TOOLING_IMAGE: local/robotics-runtime-infra/policy-tooling:foundation
      ROBOTICS_FOUNDATION_COMPOSE_PROJECT: examples/minimal-consumer/compose.yaml
      ROBOTICS_FOUNDATION_ARTIFACT_ARGUMENTS_FILE: examples/minimal-consumer/artifact-arguments.txt
      ROBOTICS_FOUNDATION_QUALIFY_PLAYBACK: "1"
      # Explicit policy for CI validation data; no dataset license is asserted.
      ROBOTICS_CAPTURE_LICENSE: NOASSERTION
      ROBOTICS_CAPTURE_CLASSIFICATION: public
      ROBOTICS_CAPTURE_CLOCK_POLICY: ros-time-no-reset
      ROBOTICS_RETENTION_CLASS: pull-request-7d
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: false
      - uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43  # 4.0.0
        with:
          bats-version: "1.14.0"
      - uses: ./.github/actions/setup-buildx
      - uses: docker/setup-compose-action@16feee727cbdc83b6a014e6cc26fec4a79bcf30c  # v2.2.0
        with:
          version: v5.3.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Set reproducible build metadata
        run: scripts/ci/set-build-metadata.sh
      - name: Import exact foundation sources
        run: bash scripts/ci/foundation/import-sources.sh
      - name: Validate contracts and simulation guard together
        run: bash scripts/ci/foundation/validate-foundation.sh
      - name: Build foundation runtime images
        run: bash scripts/ci/foundation/build-images.sh
      - name: Verify embedded foundation revisions
        run: bash scripts/ci/foundation/verify-image-lock.sh
      - name: Qualify the positive installed ROS host consumer on Docker
        run: bash scripts/ci/host/run-installed-legacy.sh
      - name: Verify versioned S3 evidence with the installed harness
        run: bash scripts/ci/integration/verify-versioned-s3-evidence.sh
      - name: Run scenario against the real ROS graph
        run: bash scripts/ci/foundation/run-runtime.sh
      - name: Run two isolated workspace acceptance paths
        env:
          ROBOTICS_STEP_INTERVAL_SEC: "0.01"
          # Qualify the native received chronology independently of Clock payloads.
          ROBOTICS_RECORD_USE_SIM_TIME: "false"
          ROBOTICS_NATIVE_UST_TRACE: ${{ inputs.native_ust_trace && '1' || '0' }}
          ROBOTICS_CAPTURE_CLOCK_POLICY: system-time
        run: bash scripts/ci/foundation/run-acceptance-isolation.sh
      - name: Run the default edge-attach verifier against live simulation
        run: bash scripts/ci/foundation/run-edge-attach.sh
      - name: Reject a wrong manifest digest and qualify the native neutral robot
        run: bash examples/neutral-robot/verify-foundation.sh
      - name: Capture foundation logs
        if: always()
        run: |
          mkdir -p artifacts
          docker ps --all --no-trunc > artifacts/docker-containers.txt
          docker network ls --no-trunc > artifacts/docker-networks.txt
      - name: Upload foundation evidence
        id: upload-foundation-evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: foundation-reports-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

  ci-supply-chain:
    if: always()
    needs:
      - changes
      - integration
      - amd-supply-chain
      - intel-image
      - nvidia-image
      - nvidia-jetson-supply-chain
      - rknn-supply-chain
      - rknn-arm64-image
      - portable-arm64
      - reproducibility
      - foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the supply-chain gate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          AFFECTED: ${{ needs.changes.outputs.affected }}
        run: |
          printf '%s\n' "${NEEDS_JSON}" | jq -e --arg affected "${AFFECTED}" '
            .changes.result == "success" and
            (del(.changes) | all(.[];
              .result == "success" or
              (.result == "skipped" and $affected == "false")
            ))
          '
          if test "${AFFECTED}" = "false"; then
            printf 'supply chain: not affected — image inputs unchanged\n' >>"${GITHUB_STEP_SUMMARY}"
          fi
