---
receivers:
  file_log/chrony:
    include: [/run/robotics-time/chrony.log]
    start_at: beginning
    poll_interval: 100ms
    operators:
      - type: json_parser
        parse_to: body

processors:
  resource/clock:
    attributes:
      - key: robotics.clock.sync_protocol
        action: upsert
        value: chrony_ntp
      - key: robotics.clock.source
        action: upsert
        value: chronyc_tracking
  transform/source:
    error_mode: propagate
    log_statements:
      - context: log
        statements:
          - >-
            set(log.attributes["robotics.clock.sample_unix_ms"],
            Double(log.body["source_unix_ms"]))
  transform/age:
    error_mode: propagate
    metric_statements:
      - context: datapoint
        statements:
          - >-
            set(datapoint.value_double,
            Double(UnixNano(datapoint.time)) / 1000000.0 -
            datapoint.attributes["robotics.clock.sample_unix_ms"]) where
            metric.name == "robotics.hardware.message.age"

connectors:
  signal_to_metrics/clock:
    error_mode: propagate
    logs:
      - name: robotics.hardware.clock.offset
        unit: ms
        attributes: &sample-attributes
          - key: robotics.clock.sample_unix_ms
        gauge:
          value: Double(log.body["offset_ms"])
      - name: robotics.hardware.clock.drift
        unit: ppm
        attributes: *sample-attributes
        gauge:
          value: Double(log.body["drift_ppm"])
      - name: robotics.hardware.message.age
        unit: ms
        attributes: *sample-attributes
        gauge:
          value: "0.0"
      - name: robotics.hardware.clock.monotonic
        unit: "1"
        attributes: *sample-attributes
        gauge:
          value: Int(log.body["monotonic"])

exporters:
  file/contract:
    path: /evidence/hardware-time.otlp.json
    format: json
    append: false
    flush_interval: 100ms

service:
  telemetry:
    logs:
      level: info
  pipelines:
    logs:
      receivers: [file_log/chrony]
      processors: [resource/clock, transform/source]
      exporters: [signal_to_metrics/clock]
    metrics:
      receivers: [signal_to_metrics/clock]
      processors: [transform/age]
      exporters: [file/contract]
