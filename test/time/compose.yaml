---
services:
  time-fixture:
    image: "${HOST_IO_FIXTURE_IMAGE}"
    user: "${ROBOTICS_CHRONY_IDENTITY:?set fixture _chrony UID:GID}"
    init: true
    network_mode: none
    read_only: true
    command: [chronyd, -U, -d, -x, -f, /etc/chrony/chrony.conf]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    volumes:
      - type: bind
        source: "${ROBOTICS_TIME_SOCKET_DIR}"
        target: /run/robotics-time
      - type: bind
        source: "${ROBOTICS_CHRONY_FIXTURE_CONFIG}"
        target: /etc/chrony/chrony.conf
        read_only: true
    healthcheck:
      test: [CMD-SHELL, "test -S /run/robotics-time/chronyd.sock"]
      interval: 1s
      timeout: 1s
      retries: 30
