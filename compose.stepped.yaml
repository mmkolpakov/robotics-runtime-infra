---
services:
  simulation:
    command:
      - ros2
      - launch
      - robotics_runtime_infra
      - headless.launch.py
      - "gz_args:=-s -v 2"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /usr/local/bin/robotics-entrypoint timeout 5 gz service -l |
          grep -q '^/world/empty/control$'
      interval: 2s
      timeout: 6s
      start_period: 20s
      retries: 15

  simulation-stepper:
    image: "${SIMULATION_IMAGE:-local/robotics-runtime-infra/simulation:dev}"
    profiles: [stepped]
    init: true
    network_mode: service:simulation
    command:
      - bash
      - -Eeuo
      - pipefail
      - -c
      - |
        if ! [[ "$${ROBOTICS_STEPS_PER_TICK}" =~ ^[1-9][0-9]*$ ]]; then
          printf 'ROBOTICS_STEPS_PER_TICK must be a positive integer\n' >&2
          exit 2
        fi
        while true; do
          gz service \
            --service /world/empty/control \
            --reqtype gz.msgs.WorldControl \
            --reptype gz.msgs.Boolean \
            --timeout 1000 \
            --req "pause: true, multi_step: $${ROBOTICS_STEPS_PER_TICK}" \
            >/dev/null
          sleep "$${ROBOTICS_STEP_INTERVAL_SEC}"
        done
    environment:
      GZ_PARTITION: "${GZ_PARTITION:-robotics-runtime}"
      ROBOTICS_STEP_INTERVAL_SEC: "${ROBOTICS_STEP_INTERVAL_SEC:-0.2}"
      ROBOTICS_STEPS_PER_TICK: "${ROBOTICS_STEPS_PER_TICK:-1}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      simulation:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /usr/local/bin/robotics-entrypoint timeout 5 gz service -l |
          grep -q '^/world/empty/control$'
      interval: 2s
      timeout: 6s
      start_period: 5s
      retries: 10

  runtime-manifest:
    environment:
      ROBOTICS_TIME_MODE: simulation_stepped
