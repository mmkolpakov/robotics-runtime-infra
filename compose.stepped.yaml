---
services:
  simulation:
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/robotics-entrypoint
        - timeout
        - "5"
        - ros2
        - service
        - type
        - "${ROBOTICS_SIMULATOR_SERVICE_NAMESPACE:-/simulator}/get_simulator_features"
      interval: 2s
      timeout: 6s
      start_period: 20s
      retries: 15

  simulation-stepper:
    image: "${SIMULATION_IMAGE:-local/robotics-runtime-infra/simulation:dev}"
    profiles: [stepped]
    init: true
    network_mode: service:simulation
    command:
      - python3
      - -m
      - robotics_runtime_infra.simulation_control
      - --namespace
      - "${ROBOTICS_SIMULATOR_SERVICE_NAMESPACE:-/simulator}"
      - step
      - --steps
      - "${ROBOTICS_STEPS_PER_TICK:-1}"
      - --interval-sec
      - "${ROBOTICS_STEP_INTERVAL_SEC:-0.2}"
    environment:
      GZ_PARTITION: "${GZ_PARTITION:-robotics-runtime}"
      ROS_AUTOMATIC_DISCOVERY_RANGE: "${ROS_AUTOMATIC_DISCOVERY_RANGE:-SUBNET}"
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      simulation:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/robotics-entrypoint
        - timeout
        - "5"
        - ros2
        - service
        - type
        - "${ROBOTICS_SIMULATOR_SERVICE_NAMESPACE:-/simulator}/step_simulation"
      interval: 2s
      timeout: 6s
      start_period: 5s
      retries: 10

  runtime-manifest:
    environment:
      ROBOTICS_TIME_MODE: simulation_stepped
