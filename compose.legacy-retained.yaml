---
# Separate postprocessing project: acquired run volumes are absent here.
services:
  legacy-coordinator:
    image: "${LEGACY_FINALIZER_IMAGE:?immutable finalizer image required}"
    pull_policy: never
    user: "1000:1000"
    init: true
    network_mode: none
    read_only: true
    mem_limit: 512m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,mode=1777,size=512m
    working_dir: /retained
    entrypoint: []
    volumes:
      - retained-data:/retained
    labels:
      org.robotics.runtime.run-id: "${ROBOTICS_RUN_ID:?owner required}"
volumes:
  retained-data:
    external: true
    name: "${ROBOTICS_RETAINED_VOLUME:?host-owned retained volume required}"
