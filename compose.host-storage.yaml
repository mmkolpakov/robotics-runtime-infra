---
services:
  storage-init:
    image: node:24.21.0-trixie-slim@sha256:b64fccfbcd1ae10d11b969a868b50e1c2530a7054813d5cdea04ac3bce551697
    pull_policy: never
    user: "0:0"
    network_mode: none
    command: [node, /fixture/storage.mjs, init]
    volumes:
      - run-data:/run/robotics
      - run-input:/run/robotics/input
      - ./host/tools/storage.mjs:/fixture/storage.mjs:ro
    labels:
      org.robotics.runtime.run-id: "${ROBOTICS_RUN_ID:?run owner required}"
  storage-worker:
    image: node:24.21.0-trixie-slim@sha256:b64fccfbcd1ae10d11b969a868b50e1c2530a7054813d5cdea04ac3bce551697
    pull_policy: never
    user: "10001:1000"
    network_mode: none
    read_only: true
    mem_limit: 256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: [node, /fixture/storage.mjs, worker]
    depends_on:
      storage-init:
        condition: service_completed_successfully
    volumes:
      - run-data:/run/robotics
      - run-input:/run/robotics/input:ro
      - ./host/tools/storage.mjs:/fixture/storage.mjs:ro
    labels:
      org.robotics.runtime.run-id: "${ROBOTICS_RUN_ID:?run owner required}"
  storage-host:
    image: node:24.21.0-trixie-slim@sha256:b64fccfbcd1ae10d11b969a868b50e1c2530a7054813d5cdea04ac3bce551697
    pull_policy: never
    user: "1000:1000"
    network_mode: none
    read_only: true
    mem_limit: 256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: [node, /fixture/storage.mjs, host]
    depends_on:
      storage-worker:
        condition: service_completed_successfully
    volumes:
      - run-data:/run/robotics
      - run-input:/run/robotics/input
      - ./host/tools/storage.mjs:/fixture/storage.mjs:ro
    labels:
      org.robotics.runtime.run-id: "${ROBOTICS_RUN_ID:?run owner required}"
volumes:
  run-data:
    name: "${ROBOTICS_RUN_ID:?run owner required}-data"
    labels:
      org.robotics.runtime.run-id: "${ROBOTICS_RUN_ID:?run owner required}"
  run-input:
    name: "${ROBOTICS_RUN_ID:?run owner required}-input"
    labels:
      org.robotics.runtime.run-id: "${ROBOTICS_RUN_ID:?run owner required}"
