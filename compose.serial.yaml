---
services:
  simulation:
    profiles: [simulation]

  serial-device-preflight:
    image: busybox:1.38.0-musl@sha256:ea2b9914a16a4ac1981994af97b318f7c7d4db76b580c56177f08bf76f4a0be8
    profiles: [serial-preflight]
    init: true
    network_mode: none
    read_only: true
    command: [test, -c, /dev/robotics/target]
    devices:
      - "${ROBOTICS_SERIAL_DEVICE:?set stable serial device path}:/dev/robotics/target:r"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      disable: true
