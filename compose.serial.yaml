---
services:
  simulation:
    profiles: [simulation]

  serial-device-preflight:
    image: busybox:1.37.0-musl@sha256:f6a95d611e0a8780fabdb2aec43e31275b2720dfefa3e41b16835bfc42454478
    profiles: [serial-preflight]
    init: true
    network_mode: none
    read_only: true
    command: [test, -c, /dev/robotics/target]
    devices:
      - "${ROBOTICS_SERIAL_DEVICE:?set stable serial device path}:/dev/robotics/target:r"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      disable: true
