---
services:
  simulation:
    profiles: [simulation]

  serial-device-preflight:
    image: busybox:1.37.0-musl@sha256:5cec3fc171c87218698e85a52af7087de727372aae264a787b8112901a5b0092
    profiles: [serial-preflight]
    init: true
    network_mode: none
    read_only: true
    command: [test, -c, /dev/robotics/target]
    devices:
      - "${ROBOTICS_SERIAL_DEVICE:?set stable serial device path}:/dev/robotics/target:r"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      disable: true
