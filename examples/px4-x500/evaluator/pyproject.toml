[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "px4-x500-evaluator"
version = "0.1.0"
description = "Evidence-bound stock PX4 X500 SDK observation assertions"
requires-python = ">=3.12,<3.15"
dependencies = ["robotics-runtime-contracts>=0.21,<0.22", "robotics-acceptance-harness>=0.22,<0.23"]

[project.entry-points."robotics_acceptance.evaluators"]
"org.example.px4-x500" = "px4_x500_evaluator:evaluate"

[tool.hatch.build.targets.wheel]
packages = ["src/px4_x500_evaluator"]
