---
services:
  caller-probe:
    image: "${OBSERVER_IMAGE:?OBSERVER_IMAGE is required}"
    entrypoint: [/opt/venv/bin/python, /consumer/probe.py]
    init: true
    restart: "no"
    read_only: true
    environment:
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"
      RMW_IMPLEMENTATION: "${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}"
      ROBOTICS_RUN_ID: "${ROBOTICS_RUN_ID:?ROBOTICS_RUN_ID is required}"
      ROBOTICS_DOMAIN_ID: "${ROBOTICS_DOMAIN_ID:?ROBOTICS_DOMAIN_ID is required}"
    volumes:
      - type: bind
        source: ./examples/generic-consumer/probe.py
        target: /consumer/probe.py
        read_only: true
      - type: bind
        source: ./examples/generic-consumer/inputs/opaque.bin
        target: /consumer/opaque.bin
        read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: [CMD, /opt/venv/bin/python, -c, "from pathlib import Path; assert Path('/tmp/consumer-ready').is_file()"]
      interval: 1s
      timeout: 2s
      retries: 30
    stop_grace_period: 60s
