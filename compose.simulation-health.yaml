---
# Native startup stays prompt; steady probes avoid repeated ROS CLI discovery.
# Requires Docker Engine 25 / API 1.44; Podman startup scheduling is unqualified.
services:
  simulation:
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/robotics-entrypoint
        - timeout
        - "5"
        - ros2
        - service
        - call
        - "${ROBOTICS_SIMULATOR_SERVICE_NAMESPACE:-/simulator}/get_simulator_features"
        - simulation_interfaces/srv/GetSimulatorFeatures
        - '{}'
      start_interval: 2s
      interval: 30s
      timeout: 6s
      start_period: 20s
      retries: 3
