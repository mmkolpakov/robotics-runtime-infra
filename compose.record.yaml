---
x-recorder: &recorder
  image: "${SIMULATION_IMAGE:-local/robotics-runtime-infra/simulation:dev}"
  init: true
  stop_signal: SIGINT
  stop_grace_period: 30s
  depends_on:
    simulation:
      condition: service_healthy
  environment: &recorder-environment
    RCUTILS_COLORIZED_OUTPUT: "${RCUTILS_COLORIZED_OUTPUT:-1}"
    RMW_IMPLEMENTATION: "${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}"
    ROS_AUTOMATIC_DISCOVERY_RANGE: "${ROS_AUTOMATIC_DISCOVERY_RANGE:-SUBNET}"
    ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  volumes:
    - type: bind
      source: "${ROBOTICS_BAG_DIR:-./runs/current/bags}"
      target: /run/bags
    - type: bind
      source: "${ROBOTICS_RECORDING_CONFIG_DIR:-./config/recording}"
      target: /etc/robotics/recording
      read_only: true
  healthcheck:
    test:
      - CMD
      - /usr/local/bin/robotics-entrypoint
      - timeout
      - "5"
      - ros2
      - service
      - type
      - /rosbag2_recorder/stop
    interval: 2s
    timeout: 6s
    start_period: 10s
    retries: 10

services:
  recorder:
    <<: *recorder
    profiles: [record]
    # Explicit storage-clock selection applies to the normal recorder.
    environment:
      <<: *recorder-environment
      ROBOTICS_RECORD_USE_SIM_TIME: "${ROBOTICS_RECORD_USE_SIM_TIME-true}"
    command:
      - bash
      - -c
      - |
        set -eu
        # Capture metadata is stamped by the recorder process, before native exec.
        # Dataset governance and clock policy are explicit caller declarations.
        case "$$ROBOTICS_RECORD_USE_SIM_TIME" in
          true) set -- "$$@" --use-sim-time; record_timestamp_basis=ros_time ;;
          false) record_timestamp_basis=system_time ;;
          *) printf 'ROBOTICS_RECORD_USE_SIM_TIME must be true or false\n' >&2; exit 64 ;;
        esac
        exec "$$@" --custom-data \
          "captured_at=$$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          "run_id=${ROBOTICS_RUN_ID:?ROBOTICS_RUN_ID is required}" \
          "retention_class=${ROBOTICS_RETENTION_CLASS:-pull-request-7d}" \
          "dataset_license=${ROBOTICS_CAPTURE_LICENSE:-}" \
          "data_classification=${ROBOTICS_CAPTURE_CLASSIFICATION:-}" \
          "capture_clock_policy=${ROBOTICS_CAPTURE_CLOCK_POLICY:-}" \
          "record_timestamp_basis=$$record_timestamp_basis"
      - recorder
      - ros2
      - bag
      - record
      - --storage
      - mcap
      - --output
      - "${ROBOTICS_BAG_OUTPUT:-/run/bags/recording}"
      - --regex
      - "${ROBOTICS_RECORD_REGEX:-^/clock$}"
      - --qos-profile-overrides-path
      - /etc/robotics/recording/qos-overrides.yaml
      - --storage-config-file
      - /etc/robotics/recording/mcap-writer.yaml
      - --max-bag-size
      - "${ROBOTICS_MAX_BAG_SIZE:-1073741824}"
      - --max-bag-duration
      - "${ROBOTICS_MAX_BAG_DURATION:-60}"
      - --max-cache-size
      - "${ROBOTICS_MAX_CACHE_SIZE:-67108864}"
      - --disable-keyboard-controls

  recorder-snapshot:
    <<: *recorder
    profiles: [snapshot]
    command:
      - ros2
      - bag
      - record
      - --storage
      - mcap
      - --output
      - "${ROBOTICS_BAG_OUTPUT:-/run/bags/snapshot}"
      - --regex
      - "${ROBOTICS_RECORD_REGEX:-^/clock$}"
      - --qos-profile-overrides-path
      - /etc/robotics/recording/qos-overrides.yaml
      - --storage-config-file
      - /etc/robotics/recording/mcap-writer.yaml
      - --max-cache-size
      - "${ROBOTICS_SNAPSHOT_CACHE_SIZE:-536870912}"
      - --snapshot-mode
      - --use-sim-time
      - --disable-keyboard-controls
      - --custom-data
      - "run_id=${ROBOTICS_RUN_ID:?ROBOTICS_RUN_ID is required}"
      - "retention_class=${ROBOTICS_RETENTION_CLASS:-pull-request-7d}"
